# =============================================================================
# Networks - prod-net 생성 담당
# =============================================================================
networks:
  prod-net:
    name: prod-net
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  prod-mysql-data:
    name: prod-mysql-data
