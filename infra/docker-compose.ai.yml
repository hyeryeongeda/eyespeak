# =============================================================================
# AI Servers - TTS + Caregiver (dev-net, prod-net 공유)
# =============================================================================
# 사용: make ai-up / make ai-down
# data-prod-up, data-dev-up 이후에 실행 (네트워크 먼저 생성되어야 함)
# =============================================================================

services:
  ai-tts:
    build: ../ai-tts
    container_name: eyespeak-ai-tts
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      # 공유 모델 (호스트에 배치 필요: best_model.pth, config.json, vocab.json, dvae.pth, mel_stats.pth)
      - ${TTS_MODEL_PATH:-../checkpoints/shared}:/app/checkpoints/shared:ro
      # 환자별 레퍼런스 음성 (컨테이너 내부에서 read/write)
      - tts-speaker-refs:/app/speaker_refs
    networks:
      - dev-net
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  ai-caregiver:
    build: ../caregiver_partner_package
    container_name: eyespeak-ai-caregiver
    restart: unless-stopped
    expose:
      - "5003"
    env_file: ../infra/.env.ai
    networks:
      - dev-net
      - prod-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  ai-eyetracking:
    build:
      context: ../ai-eyetracking
      dockerfile: Dockerfile
    container_name: eyespeak-ai-eyetracking
    ports:
      - "5000:5000"
    volumes:
      - eyetracking-calibration:/app/calibration_data
    restart: unless-stopped
    networks:
      - dev-net
      - prod-net

volumes:
  tts-speaker-refs:
    name: tts-speaker-refs
  eyetracking-calibration:

networks:
  dev-net:
    external: true
  prod-net:
    external: true
