# ── 공통 upstream ──────────────────────────────────────────
upstream front-blue  { server eyespeak-front-blue:80; }
upstream front-green { server eyespeak-front-green:80; }
upstream front-dev   { server eyespeak-front-dev:80; }

upstream was-blue  { server eyespeak-was-blue:8080; }
upstream was-green { server eyespeak-was-green:8080; }
upstream was-dev   { server eyespeak-was-dev:8080; }

# ── HTTP → HTTPS 리다이렉트 ──────────────────────────────
server {
    listen 80;
    server_name j14e205.p.ssafy.io;
    return 301 https://$host$request_uri;
}

# ── HTTPS (경로 기반 라우팅) ─────────────────────────────
server {
    listen 443 ssl;
    server_name j14e205.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j14e205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j14e205.p.ssafy.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── Dev 백엔드 API (/dev/api/v1/) ────────────────────
    location /dev/api/v1/ {
        proxy_pass http://was-dev/api/v1/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Dev 프론트엔드 (/dev/) ───────────────────────────
    location /dev/ {
        proxy_pass http://front-dev/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prod 백엔드 API (/api/v1/) ──────────────────────
    location /api/v1/ {
        proxy_pass http://was-blue;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prod 프론트엔드 (/) ─────────────────────────────
    location / {
        proxy_pass http://front-blue;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
