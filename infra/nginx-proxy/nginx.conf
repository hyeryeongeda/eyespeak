# =============================================================================
# Nginx Reverse Proxy - 메인 설정
# =============================================================================
# 모든 외부 트래픽의 단일 진입점
# Production: /        → 프론트엔드,  /api/v1/  → 백엔드
# Dev:        /dev/    → 프론트엔드,  /dev/api/v1/ → 백엔드
# =============================================================================

# ── 전역 설정 ────────────────────────────────────────────────
user nginx;                    # nginx 유저로 실행
worker_processes auto;         # CPU 코어 수만큼 워커 자동 생성
error_log /var/log/nginx/error.log warn;   # 에러 로그 경로
pid /var/run/nginx.pid;        # 프로세스 ID 파일

# ── 연결 설정 ────────────────────────────────────────────────
events {
    worker_connections 1024;   # 워커 하나당 동시 연결 최대 1024개
    use epoll;                 # Linux에서 가장 빠른 이벤트 처리 방식
    multi_accept on;           # 한번에 여러 연결 동시 수락
}

# ── HTTP 블록 (건물 전체 규칙) ────────────────────────────────
http {
    include /etc/nginx/mime.types;         # 파일 확장자별 타입 정의 (css, js 등)
    default_type application/octet-stream; # 모르는 파일은 다운로드 처리

    # 파일 업로드 최대 크기
    client_max_body_size 20M;

    # ── 로그 포맷 (상세) ─────────────────────────────────────
    # 누가(IP), 언제, 뭘 요청했는지, 응답 시간까지 기록
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── 성능 최적화 ──────────────────────────────────────────
    sendfile on;               # 파일 전송 최적화 (커널에서 직접 전송)
    tcp_nopush on;             # 헤더+본문을 한 패킷에 묶어서 전송
    tcp_nodelay on;            # 작은 패킷도 즉시 전송 (지연 없음)
    keepalive_timeout 65;      # 연결 유지 시간 65초
    types_hash_max_size 2048;  # MIME 타입 해시 테이블 크기

    # ── gzip 압축 (모든 응답에 적용) ─────────────────────────
    gzip on;                   # 압축 켜기
    gzip_vary on;              # 프록시 캐시에 압축 여부 알림
    gzip_proxied any;          # 프록시 경유 응답도 압축
    gzip_comp_level 6;         # 압축 레벨 (1~9, 6이 균형점)
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml application/xml+rss
               text/javascript;

    # ── 보안 헤더 (모든 응답에 적용) ─────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;        # 클릭재킹 방어
    add_header X-Content-Type-Options "nosniff" always;    # MIME 스니핑 방어
    add_header X-XSS-Protection "1; mode=block" always;    # XSS 공격 방어

    # =========================================================
    # Upstream 정의 (요청을 보낼 백엔드 서버 목록)
    # =========================================================

    # ── Prod 백엔드 (Blue/Green 배포) ────────────────────────
    # 전환 시 아래 주석만 교체하면 됨
    upstream prod-was {
        server eyespeak-was-blue:8080;       # ← 현재 활성
        # server eyespeak-was-green:8080;    # ← 대기 (전환 시 주석 교체)
        keepalive 32;          # 연결 32개 재활용 (매번 새로 안 맺음)
    }

    # ── Prod 프론트엔드 (Blue/Green 배포) ────────────────────
    upstream prod-front {
        server eyespeak-front-blue:80;       # ← 현재 활성
        # server eyespeak-front-green:80;    # ← 대기 (전환 시 주석 교체)
        keepalive 16;
    }

    # ── Dev: upstream 블록 대신 resolver + 변수 방식 사용 ──────
    # Docker 내장 DNS(127.0.0.11)를 통해 매 요청마다 최신 컨테이너 IP를 조회
    # (upstream 블록은 기동 시 1회만 resolve → 컨테이너 재시작 시 502 발생)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =========================================================
    # HTTP → HTTPS 리다이렉트
    # =========================================================
    server {
        listen 80;
        server_name j14e205.p.ssafy.io;

        # /health는 리다이렉트 없이 바로 응답 (헬스체크용)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 나머지는 전부 HTTPS로 보냄
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================
    # HTTPS 서버 (메인)
    # =========================================================
    server {
        listen 443 ssl http2;              # SSL + HTTP/2 활성화
        server_name j14e205.p.ssafy.io;

        # ── SSL 인증서 ───────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/j14e205.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/j14e205.p.ssafy.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;    # 안전한 프로토콜만 허용
        ssl_session_timeout 1d;                   # SSL 세션 캐시 1일
        ssl_session_cache   shared:SSL:50m;       # SSL 세션 캐시 50MB

        # HSTS: 브라우저에게 "앞으로 이 사이트는 무조건 HTTPS로 접속해" 라고 알림
        add_header Strict-Transport-Security "max-age=63072000" always;

        # ── Prod 프론트엔드 (/) ──────────────────────────────
        location / {
            proxy_pass http://prod-front;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;        # WebSocket 지원
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;       # 실제 사용자 IP 전달
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;    # http/https 구분 전달
        }

        # ── Prod 백엔드 API (/api/v1/) ──────────────────────
        location /api/v1/ {
            proxy_pass http://prod-was/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃 (백엔드 응답 오래 걸릴 수 있으니)
            proxy_connect_timeout 60s;     # 연결 대기 최대 60초
            proxy_send_timeout 60s;        # 요청 전송 최대 60초
            proxy_read_timeout 60s;        # 응답 대기 최대 60초
        }

        # ── Prod WebSocket (/ws) ────────────────────────────
        # STOMP 기반 실시간 통신 (채팅, 호출 등)
        # Prod Eye-Tracking API (/eye-tracking-api/)
        location /eye-tracking-api/ {
            proxy_pass http://host.docker.internal:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /ws {
            proxy_pass http://prod-was/api/v1/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;      # WebSocket 연결 유지 1시간
            proxy_send_timeout 3600s;
        }

        # ── Dev WebSocket (/dev/ws) ─────────────────────────
        location /dev/ws {
            set $upstream_dev_was http://eyespeak-was-dev:8080;
            proxy_pass $upstream_dev_was/api/v1/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Dev Eye-Tracking API (/dev/eye-tracking-api/) ────
        # 호스트 머신에서 실행 중인 eye-tracking Python 서비스로 프록시
        location /dev/eye-tracking-api/ {
            proxy_pass http://host.docker.internal:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── Dev 프론트엔드 (/dev/) ───────────────────────────
        # set $variable 방식으로 매 요청마다 Docker DNS 조회
        location /dev/ {
            set $upstream_dev_front http://eyespeak-front-dev:5173;
            proxy_pass $upstream_dev_front;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;        # WebSocket (Vite HMR)
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Dev 백엔드 API (/dev/api/v1/) ────────────────────
        location /dev/api/v1/ {
            set $upstream_dev_was http://eyespeak-was-dev:8080;
            rewrite ^/dev(/api/v1/.*)$ $1 break;
            proxy_pass $upstream_dev_was;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── Jenkins (/jenkins/) ──────────────────────────────
        # Jenkins 웹 UI를 도메인/jenkins로 접속 가능하게 함
        location /jenkins {
            proxy_pass http://jenkins:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 헬스체크 ─────────────────────────────────────────
        location /health {
            access_log off;                # 헬스체크 로그는 안 남김 (너무 많아서)
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
