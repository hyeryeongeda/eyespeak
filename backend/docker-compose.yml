# 백엔드 공통 설정 (기본)
# 사용: docker-compose -f docker-compose.yml -f docker-compose.{local|dev|prod}.yml up -d
#
# Blue/Green 포트: Blue=8081, Green=8082 (공통).
# - Local: profile 없이 up → WAS 안 띄움 (DB/Redis/RabbitMQ만)
# - Dev:  --profile blue  → was-blue만
# - Prod: --profile blue --profile green  → was-blue + was-green
networks:
  data-net:
    driver: bridge

services:
  was-blue:
    build: .
    container_name: eyespeak-was-blue
    ports:
      - "8081:8080"
    profiles:
      - "blue"
    networks:
      - data-net
    # env, env_file, depends_on 은 환경별 override에서 설정

  was-green:
    build: .
    container_name: eyespeak-was-green
    ports:
      - "8082:8080"
    profiles:
      - "green"
    networks:
      - data-net
    # env, env_file, depends_on 은 환경별 override에서 설정
