# 로컬 DB 계정은 환경변수로 설정 (공개 레포에 비밀번호 올리지 않기)
# IDE 실행 설정 또는 터미널에서 DB_USERNAME, DB_PASSWORD 지정
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eyespeak?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

server:
  port: 8080

logging:
  level:
    e205.eyespeak: DEBUG
    org.hibernate.SQL: DEBUG