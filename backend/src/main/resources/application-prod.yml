# prod 프로필 — 운영은 반드시 JWT_SECRET 등을 환경변수로 주입
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

# AI 서버
ai:
  server:
    url: ${AI_SERVER_URL:http://eyespeak-ai-caregiver:5003}
  tts:
    url: ${AI_TTS_URL:http://eyespeak-ai-tts:8000}
  internal:
    api-key: ${AI_INTERNAL_API_KEY}
