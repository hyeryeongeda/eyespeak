# =============================================================================
# 운영 서버(Prod)용 override
# =============================================================================
# 사용: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml --profile blue --profile green up -d --build
#
# [전제조건] infra/docker-compose.data.prod.yml 로 DB/Redis/RabbitMQ 먼저 실행
# [네트워크] prod-net (external) — Nginx가 컨테이너명(eyespeak-was-blue/green)으로 접근
# [포트] 외부 포트 없음 (Nginx 경유)
# =============================================================================
networks:
  prod-net:
    external: true

services:
  was-blue:
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://eyespeak-db-prod:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - prod-net

  was-green:
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://eyespeak-db-prod:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - prod-net
