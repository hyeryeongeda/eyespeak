# =============================================================================
# 개발 서버(Dev)용 override
# =============================================================================
# 사용: docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml --profile blue up -d --build
#
# [전제조건] infra/docker-compose.data.dev.yml 로 DB/Redis/RabbitMQ 먼저 실행
# [네트워크] dev-net (external) — Nginx가 컨테이너명(eyespeak-was-dev)으로 접근
# [포트] 외부 포트 없음 (Nginx 경유)
# =============================================================================
networks:
  dev-net:
    external: true

services:
  was-blue:
    container_name: eyespeak-was-dev
    env_file: .env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://eyespeak-db-dev:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - dev-net
