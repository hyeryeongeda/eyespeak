# Shared runtime defaults for the gaze pipeline.
# loader.py may still override individual values from environment variables.

detector:
  # "haar" | "mediapipe"
  type: mediapipe
  gaze_input_h: 224
  gaze_input_w: 224

grid:
  yaw_range: 25.0
  pitch_range: 20.0
  rows: 2
  cols: 3
  pitch_offset_deg: 0.0
  yaw_offset_deg: 0.0
  cell_stability_count: 4
  hysteresis_threshold: 0.10

smoothing:
  use_gaze_refiner: true
  refiner_type: one_euro
  gaze_refiner_alpha: 0.3
  one_euro_min_cutoff_x: 0.5
  one_euro_beta_x: 0.2
  one_euro_min_cutoff_y: 0.40
  one_euro_beta_y: 2.0
  screen_hold_ms: 500
  screen_outlier_distance: 0.5
  screen_fallback_jump_margin: 0.10
  readiness_valid_streak: 2
  blink_ear_threshold: 0.15

weights:
  head_pose_weight: 0.0
  iris_gaze_weight: 0.7
  l2cs_weight: 0.3

calibration:
  points: 18
  # 3x6 센터-퍼스트: JS getCalibPoints(18)과 동일 순서
  target_rx:
    - 0.50
    - 0.30
    - 0.70
    - 0.10
    - 0.90
    - 0.01
    - 0.50
    - 0.30
    - 0.70
    - 0.10
    - 0.90
    - 0.01
    - 0.50
    - 0.30
    - 0.70
    - 0.10
    - 0.90
    - 0.99
  target_ry:
    - 0.50
    - 0.50
    - 0.50
    - 0.50
    - 0.50
    - 0.50
    - 0.01
    - 0.01
    - 0.01
    - 0.01
    - 0.01
    - 0.01
    - 0.99
    - 0.99
    - 0.99
    - 0.99
    - 0.99
    - 0.99

trigger:
  dwell_time_sec: 1.5
  blink_select_min_sec: 0.08
  blink_select_max_sec: 0.6
  double_blink_window_sec: 1.5
  long_close_sec: 3.0
  triple_blink_window_sec: 2.5
  blink_history_ttl_sec: 4.0

paths:
  calib_save_dir: calibration_data

runtime:
  poll_interval_ms: 50
  frame_max_width: 480
  frame_jpeg_quality: 0.72
  lerp_factor: 0.35
