# 아이트래킹 파이프라인 공통 설정 (config_gaze.py와 동일 기본값)
# 환경변수로 개별 항목 오버라이드 가능 — loader.py 참고

detector:
  # "haar" | "mediapipe"
  type: mediapipe
  gaze_input_h: 224
  gaze_input_w: 224

grid:
  yaw_range: 25.0
  pitch_range: 20.0
  rows: 2
  cols: 3
  pitch_offset_deg: 0.0
  yaw_offset_deg: 0.0
  cell_stability_count: 3
  # 셀 경계 근처에서 이전 안정 셀 유지 (0이면 비활성)
  hysteresis_threshold: 0.05

smoothing:
  use_gaze_refiner: true
  # "ema" | "one_euro"
  refiner_type: one_euro
  gaze_refiner_alpha: 0.3
  one_euro_min_cutoff_x: 1.2
  one_euro_beta_x: 0.15
  one_euro_min_cutoff_y: 0.8
  one_euro_beta_y: 0.05
  # EAR 이 값 이하 → 눈 감음 (iris 정규화 신뢰도)
  screen_hold_ms: 280
  screen_outlier_distance: 0.35
  screen_fallback_jump_margin: 0.08
  readiness_valid_streak: 2
  blink_ear_threshold: 0.18

weights:
  head_pose_weight: 0.35
  iris_gaze_weight: 0.65
  l2cs_weight: 0.20

calibration:
  points: 12
  target_rx:
    - 0.03
    - 0.20
    - 0.40
    - 0.60
    - 0.80
    - 0.97
    - 0.03
    - 0.20
    - 0.40
    - 0.60
    - 0.80
    - 0.97
  target_ry:
    - 0.03
    - 0.03
    - 0.03
    - 0.03
    - 0.03
    - 0.03
    - 0.97
    - 0.97
    - 0.97
    - 0.97
    - 0.97
    - 0.97

trigger:
  dwell_time_sec: 1.5
  blink_select_min_sec: 0.3
  blink_select_max_sec: 1.0
  double_blink_window_sec: 2.0
  long_close_sec: 3.0
  triple_blink_window_sec: 3.0
  blink_history_ttl_sec: 5.0

paths:
  calib_save_dir: calibration_data

runtime:
  poll_interval_ms: 100
  frame_max_width: 480
  frame_jpeg_quality: 0.72
  # Consumed by runtime_embed.html for the client-side interpolation loop.
  lerp_factor: 0.15
