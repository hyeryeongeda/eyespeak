<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eye Tracking Runtime Embed</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        color: #e2e8f0;
        font-family: sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.01;
        pointer-events: none;
      }

      .status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.88);
        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <video id="runtime-video" autoplay muted playsinline></video>
    <div class="status" id="runtime-status">starting</div>
    <script>
      (function () {
        const searchParams = new URLSearchParams(window.location.search);
        const profileId = (searchParams.get('profileId') || searchParams.get('userId') || '').trim();
        const requestId = (searchParams.get('requestId') || `runtime-${Date.now()}`).trim();
        const autostart = searchParams.get('autostart') === '1';
        const parentOrigin = (() => {
          if (!document.referrer) {
            return '*';
          }

          try {
            return new URL(document.referrer).origin;
          } catch (_error) {
            return '*';
          }
        })();

        const MESSAGE_SOURCE = 'eyespeak-eye-tracking';
        const PARENT_SOURCE = 'eyespeak-parent';
        const videoEl = document.getElementById('runtime-video');
        const statusEl = document.getElementById('runtime-status');
        const frameCanvas = document.createElement('canvas');

        let mediaStream = null;
        let runtimeConfig = {
          poll_interval_ms: 100,
          frame_max_width: 480,
          jpeg_quality: 0.72,
          lerp_factor: 0.15,
        };
        let pollingAbort = false;
        let animationFrameId = 0;
        let currentStatus = 'idle';
        let targetPoint = null;
        let currentPoint = null;
        let lastEmitAt = 0;
        let lastDoubleBlinkAt = 0;

        function postMessage(type, payload) {
          if (window.parent === window) {
            return;
          }

          window.parent.postMessage(
            {
              source: MESSAGE_SOURCE,
              type,
              requestId,
              profileId: profileId || undefined,
              payload,
            },
            parentOrigin,
          );
        }

        function setStatus(status) {
          if (currentStatus === status) {
            statusEl.textContent = status;
            return;
          }

          currentStatus = status;
          statusEl.textContent = status;
          postMessage('RUNTIME_STATUS', { status });
        }

        function mapTrackingStatus(frame) {
          if (!frame || !frame.face) {
            return 'face-not-detected';
          }

          const hasStableScreen =
            Number.isFinite(frame.screen_x) &&
            Number.isFinite(frame.screen_y) &&
            frame.screen_x >= 0 &&
            frame.screen_x <= 1 &&
            frame.screen_y >= 0 &&
            frame.screen_y <= 1;

          return hasStableScreen ? 'ready' : 'tracking-unstable';
        }

        function encodeFrameToBase64() {
          const sourceWidth = videoEl.videoWidth;
          const sourceHeight = videoEl.videoHeight;

          if (!sourceWidth || !sourceHeight) {
            throw new Error('runtime video is not ready');
          }

          const targetWidth = Math.min(sourceWidth, Math.max(160, runtimeConfig.frame_max_width));
          const targetHeight = Math.max(1, Math.round((sourceHeight / sourceWidth) * targetWidth));

          frameCanvas.width = targetWidth;
          frameCanvas.height = targetHeight;

          const context = frameCanvas.getContext('2d', { alpha: false });
          if (!context) {
            throw new Error('runtime frame canvas is unavailable');
          }

          context.drawImage(videoEl, 0, 0, targetWidth, targetHeight);
          const dataUrl = frameCanvas.toDataURL(
            'image/jpeg',
            Math.min(0.95, Math.max(0.3, runtimeConfig.jpeg_quality)),
          );
          const parts = dataUrl.split(',', 2);

          if (!parts[1]) {
            throw new Error('runtime frame encoding failed');
          }

          return parts[1];
        }

        async function fetchRuntimeConfig() {
          try {
            const response = await fetch('./api/runtime-config');
            const data = await response.json().catch(() => ({}));

            if (!response.ok || !data || typeof data !== 'object') {
              return;
            }

            runtimeConfig = {
              poll_interval_ms:
                Number.isFinite(Number(data.poll_interval_ms)) && Number(data.poll_interval_ms) > 0
                  ? Number(data.poll_interval_ms)
                  : runtimeConfig.poll_interval_ms,
              frame_max_width:
                Number.isFinite(Number(data.frame_max_width)) && Number(data.frame_max_width) > 0
                  ? Number(data.frame_max_width)
                  : runtimeConfig.frame_max_width,
              jpeg_quality:
                Number.isFinite(Number(data.jpeg_quality))
                  ? Number(data.jpeg_quality)
                  : runtimeConfig.jpeg_quality,
              lerp_factor:
                Number.isFinite(Number(data.lerp_factor)) && Number(data.lerp_factor) > 0
                  ? Math.min(1, Number(data.lerp_factor))
                  : runtimeConfig.lerp_factor,
            };
          } catch (_error) {
            // Keep defaults when config sync fails.
          }
        }

        function clearRuntimePoint(status) {
          targetPoint = null;
          currentPoint = null;
          setStatus(status);
        }

        async function analyzeCurrentFrame() {
          const image = encodeFrameToBase64();
          const response = await fetch('./api/gaze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image }),
          });
          const frame = await response.json().catch(() => null);

          if (!response.ok || !frame || typeof frame !== 'object') {
            throw new Error('runtime gaze request failed');
          }

          const status = mapTrackingStatus(frame);
          if (status !== 'ready') {
            clearRuntimePoint(status);
            return;
          }

          targetPoint = {
            screenX: Number(frame.screen_x),
            screenY: Number(frame.screen_y),
            cell: Number.isInteger(frame.cell) ? frame.cell : null,
            trigger:
              frame.trigger === 'select' ||
              frame.trigger === 'start' ||
              frame.trigger === 'stop' ||
              frame.trigger === 'sos'
                ? frame.trigger
                : 'none',
          };
          setStatus('ready');

          if (targetPoint.trigger === 'start') {
            const now = Date.now();
            if (now - lastDoubleBlinkAt >= 1000) {
              lastDoubleBlinkAt = now;
              postMessage('RUNTIME_DOUBLE_BLINK', { trigger: 'start' });
            }
          }
        }

        async function runPollingLoop() {
          while (!pollingAbort) {
            try {
              await analyzeCurrentFrame();
            } catch (error) {
              clearRuntimePoint('tracking-unstable');
              postMessage('RUNTIME_ERROR', {
                message: error instanceof Error ? error.message : 'runtime polling failed',
                status: 'tracking-unstable',
              });
            }

            await new Promise(resolve =>
              window.setTimeout(resolve, Math.max(16, runtimeConfig.poll_interval_ms)),
            );
          }
        }

        function emitPointIfNeeded(now) {
          if (!currentPoint) {
            return;
          }

          if (now - lastEmitAt < 16) {
            return;
          }

          lastEmitAt = now;
          postMessage('GAZE_POINT_UPDATE', {
            screenX: currentPoint.screenX,
            screenY: currentPoint.screenY,
            cell: currentPoint.cell,
            status: 'ready',
            trigger: currentPoint.trigger,
          });
        }

        function runAnimationLoop(now) {
          if (targetPoint) {
            if (!currentPoint) {
              currentPoint = { ...targetPoint };
            } else {
              const lerpFactor = Math.min(1, Math.max(0.01, runtimeConfig.lerp_factor));
              currentPoint = {
                screenX:
                  currentPoint.screenX + (targetPoint.screenX - currentPoint.screenX) * lerpFactor,
                screenY:
                  currentPoint.screenY + (targetPoint.screenY - currentPoint.screenY) * lerpFactor,
                cell: targetPoint.cell,
                trigger: targetPoint.trigger,
              };
            }
          }

          emitPointIfNeeded(now);
          animationFrameId = window.requestAnimationFrame(runAnimationLoop);
        }

        function stopMediaStream() {
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
          }
          videoEl.srcObject = null;
        }

        function stopRuntime() {
          pollingAbort = true;
          if (animationFrameId) {
            window.cancelAnimationFrame(animationFrameId);
            animationFrameId = 0;
          }
          stopMediaStream();
          clearRuntimePoint('idle');
        }

        async function startRuntime() {
          await fetchRuntimeConfig();

          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'user',
            },
            audio: false,
          });

          videoEl.srcObject = mediaStream;
          await videoEl.play().catch(() => undefined);

          pollingAbort = false;
          currentPoint = null;
          targetPoint = null;
          setStatus('face-not-detected');
          postMessage('RUNTIME_READY', { autostart });
          void runPollingLoop();
          animationFrameId = window.requestAnimationFrame(runAnimationLoop);
        }

        window.addEventListener('message', event => {
          const data = event.data;
          if (!data || typeof data !== 'object') {
            return;
          }

          if (data.source !== PARENT_SOURCE || data.requestId !== requestId) {
            return;
          }

          if (data.type === 'RUNTIME_STOP') {
            stopRuntime();
          }
        });

        window.addEventListener('beforeunload', stopRuntime);

        if (!autostart) {
          postMessage('RUNTIME_READY', { autostart: false });
          setStatus('idle');
          return;
        }

        if (
          !navigator.mediaDevices ||
          typeof navigator.mediaDevices.getUserMedia !== 'function'
        ) {
          postMessage('RUNTIME_ERROR', {
            message: 'camera API is unavailable',
            status: 'tracking-unstable',
          });
          setStatus('tracking-unstable');
          return;
        }

        void startRuntime().catch(error => {
          postMessage('RUNTIME_ERROR', {
            message: error instanceof Error ? error.message : 'runtime startup failed',
            status: 'tracking-unstable',
          });
          setStatus('tracking-unstable');
        });
      })();
    </script>
  </body>
</html>
