<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EYESPEAK - 시선 선택 (2×3)</title>
  <style>
    :root { --bg:#0a0a1a; --fg:#eee; --panel:#111; --line:#222; --hot:#3b82f6; --sel:#22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg);
      height: 100vh; overflow: hidden; user-select: none;
      display: flex; flex-direction: column;
    }

    #topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; background: #111; font-size: 13px; flex-shrink: 0;
      z-index: 10;
    }
    #topbar button {
      padding: 5px 14px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 600;
    }
    #btnCal { background: #2563eb; color: #fff; }
    #btnCal:disabled { opacity: .4; }
    #btnReset { background: #333; color: #ccc; margin-left: 6px; }
    #debug { font-family: monospace; font-size: 12px; color: #888; }

    #grid {
      flex: 1; display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 40px; padding: 8px;
    }
    .cell {
      position: relative;
      border: 3px solid var(--line); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: min(10vw, 72px); font-weight: 700; color: #555;
      background: var(--panel);
      width: 100%;
      height: 100%;
      transition: background .12s, border-color .12s, color .12s;
      overflow: hidden;
    }
    .cell.hot { background: #1e3a5f; border-color: var(--hot); color: #fff; }
    .cell.selected { background: #16a34a; border-color: var(--sel); color: #fff; }
    .cell.dimmed:not(.hot):not(.selected) { border-color: #333; color: #444; }
    .cell .progress {
      position: absolute; bottom: 0; left: 0; height: 5px;
      background: #f59e0b; border-radius: 0 0 12px 12px;
      transition: width .08s linear; width: 0%;
    }

    /* 캘리브레이션 오버레이 */
    #calib {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.92); display: none;
    }
    #calib.show { display: block; }
    #calibDot {
      position: fixed; width: 48px; height: 48px; border-radius: 50%;
      background: #ff6b00;
      box-shadow: 0 0 40px #ff6b00, 0 0 80px rgba(255,107,0,0.4), 0 0 120px rgba(255,107,0,0.2);
      transform: translate(-50%, -50%); pointer-events: none;
      animation: calibPulse 1.5s ease-in-out infinite;
      z-index: 205;
    }
    #calibDot::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; background: #fff; border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    @keyframes calibPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 40px #ff6b00, 0 0 80px rgba(255,107,0,0.4); }
      50% { transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 60px #ff6b00, 0 0 100px rgba(255,107,0,0.5); }
    }
    #calibText {
      position: fixed; left: 50%; top: 5%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8); border: 1px solid #333;
      padding: 10px 18px; border-radius: 12px;
      font-size: 15px; text-align: center; color: #eee;
      z-index: 201;
    }

    /* 토스트 */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; background: var(--hot); color: #fff;
      border-radius: 8px; font-weight: 600; font-size: 15px;
      display: none; z-index: 150;
    }
    #toast.show { display: block; animation: fade 2s ease-out; }
    @keyframes fade { 0%,70%{opacity:1} 100%{opacity:0} }

    /* 웹캠 */
    #camWrap {
      position: fixed; bottom: 6px; right: 6px; width: 120px;
      border-radius: 8px; overflow: hidden; border: 1px solid #333; z-index: 50;
    }
    #camWrap.guiding {
      width: 240px;
      border-color: #22c55e;
    }
    #camWrap.guiding #faceGuide { display: block; }
    #cam { width: 100%; display: block; transform: scaleX(-1); }
    #status {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 14px; color: #f59e0b; z-index: 50;
    }

    body:fullscreen #topbar { display: none; }
    body:-webkit-full-screen #topbar { display: none; }
    body:fullscreen #camWrap:not(.guiding) { display: none; }
    body:-webkit-full-screen #camWrap:not(.guiding) { display: none; }
    body:fullscreen #grid { height: 100vh; }
    body:-webkit-full-screen #grid { height: 100vh; }
    body:fullscreen #grid,
    body:-webkit-full-screen #grid {
      gap: 48px; padding: 12px;
    }

    /* 큰 카운트다운 숫자 */
    #countdownBig {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px; font-weight: 900; color: #fff;
      text-align: center;
      text-shadow: 0 0 60px rgba(255,255,255,0.8), 0 0 120px rgba(59,130,246,0.5);
      z-index: 210; pointer-events: none;
      display: none;
    }
    #countdownBig.show {
      display: block;
      animation: countPop 0.5s ease-out;
    }
    @keyframes countPop {
      0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
      60%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    }
    #countdownSub {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, 80px);
      font-size: 36px; font-weight: 600; color: rgba(255,255,255,0.85);
      text-shadow: 0 0 30px rgba(255,255,255,0.5);
      z-index: 210; pointer-events: none;
      display: none; white-space: nowrap;
    }
    #countdownSub.show {
      display: block;
      animation: countPop 0.5s ease-out;
    }

    /* 화살표 — 캘리 도트 방향 가리킴 */
    #calibArrow {
      position: fixed;
      width: 80px; height: 80px;
      z-index: 210; pointer-events: none;
      display: none;
      transition: left 0.3s ease, top 0.3s ease;
      transform: rotate(var(--arrow-angle, 0rad)) translateY(var(--float-offset, 0px));
    }
    #calibArrow.show { display: block; }
    /* 미래적 얼굴 스캐닝 오버레이 */
    #faceGuideOverlay {
      position: fixed; inset: 0; z-index: 220;
      display: none; align-items: center; justify-content: center;
      flex-direction: column;
      background: rgba(5,10,30,0.90);
      pointer-events: none;
    }
    #faceGuideOverlay.show { display: flex; }

    /* 라이브 웹캠 배경 */
    #guideCam {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 0;
      filter: brightness(0.7) contrast(1.1);
    }

    /* 얼굴 메시 캔버스 */
    #meshCanvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 스캐닝 프레임 (코너 브라켓) */
    #scanFrame {
      position: fixed;
      width: 500px; height: 180px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
    }
    .scan-corner {
      position: absolute;
      width: 50px; height: 50px;
      border-color: rgba(0,200,255,0.8);
      border-style: solid;
      border-width: 0;
    }
    .scan-corner.tl { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; }
    .scan-corner.tr { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; }
    .scan-corner.bl { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; }
    .scan-corner.br { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; }
    #scanFrame.scanning .scan-corner {
      animation: cornerPulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes cornerPulse {
      0%   { border-color: rgba(0,200,255,0.4); }
      100% { border-color: rgba(0,200,255,1); }
    }

    /* 스캔 라인 (위에서 아래로 반복) */
    #scanLine {
      position: absolute; top: 0; left: 5%; width: 90%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,200,255,0.6), transparent);
      box-shadow: 0 0 15px rgba(0,200,255,0.4);
      z-index: 3;
      animation: scanDown 2.5s ease-in-out infinite;
    }
    @keyframes scanDown {
      0%   { top: 0; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* 텍스트 */
    #faceGuideOverlay .guide-text {
      position: relative; z-index: 4;
      margin-top: 30px;
      font-size: 36px; font-weight: 700; color: #00c8ff;
      text-shadow: 0 0 20px rgba(0,200,255,0.6), 0 2px 8px rgba(0,0,0,0.8);
      letter-spacing: 2px;
      animation: textBlink 1.5s ease-in-out infinite alternate;
    }
    @keyframes textBlink {
      0%   { opacity: 0.7; }
      100% { opacity: 1; }
    }
    #faceGuideOverlay .guide-countdown {
      position: relative; z-index: 4;
      margin-top: 16px;
      font-size: 24px; color: rgba(255,255,255,0.8);
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      font-family: monospace;
    }
    #faceGuideOverlay .guide-status {
      position: relative; z-index: 4;
      margin-top: 10px;
      font-size: 14px; color: rgba(0,200,255,0.6);
      font-family: monospace; letter-spacing: 1px;
    }
    @property --float-offset {
      syntax: '<length>';
      inherits: false;
      initial-value: 0px;
    }
    @keyframes arrowFloat {
      0%, 100% {
        --float-offset: 0px;
        filter: drop-shadow(0 0 8px rgba(255,0,0,0.4));
      }
      50% {
        --float-offset: -18px;
        filter: drop-shadow(0 0 24px rgba(255,0,0,0.7));
      }
    }
  </style>
  <script src="calibration_6_to_9.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="topbar">
    <div>
      <button id="btnCal">캘리브레이션</button>
      <button id="btnReset">초기화</button>
      <button id="btnSave" style="background:#16a34a;color:#fff;margin-left:6px">저장</button>
      <button id="btnLoad" style="background:#7c3aed;color:#fff;margin-left:6px">불러오기</button>
      <button id="btnFullscreen" style="background:#6366f1;color:#fff;margin-left:6px">전체화면</button>
    </div>
    <div id="debug">대기 중…</div>
  </div>

  <div id="grid">
    <div class="cell" data-i="0">1<div class="progress"></div></div>
    <div class="cell" data-i="1">2<div class="progress"></div></div>
    <div class="cell" data-i="2">3<div class="progress"></div></div>
    <div class="cell" data-i="3">4<div class="progress"></div></div>
    <div class="cell" data-i="4">5<div class="progress"></div></div>
    <div class="cell" data-i="5">6<div class="progress"></div></div>
  </div>

  <div id="calib">
    <div id="calibDot"></div>
    <div id="calibText"></div>
    <div id="countdownBig"></div>
    <div id="countdownSub"></div>
    <svg id="calibArrow" viewBox="0 0 64 64">
      <path d="M32,8 L52,40 L38,40 L38,56 L26,56 L26,40 L12,40 Z"
            fill="#ff2222" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <div id="faceGuideOverlay">
      <video id="guideCam" autoplay playsinline muted></video>
      <canvas id="meshCanvas"></canvas>
      <div id="scanFrame" class="scanning">
        <div class="scan-corner tl"></div>
        <div class="scan-corner tr"></div>
        <div class="scan-corner bl"></div>
        <div class="scan-corner br"></div>
        <div id="scanLine"></div>
        <svg class="eye-icon eye-left" viewBox="0 0 120 60" style="position:absolute; left:15%; top:50%; transform:translateY(-50%); width:120px; height:60px; opacity:0.5;">
          <ellipse cx="60" cy="30" rx="55" ry="25" fill="none" stroke="rgba(0,200,255,0.6)" stroke-width="2"/>
          <circle cx="60" cy="30" r="12" fill="rgba(0,200,255,0.4)"/>
          <circle cx="60" cy="30" r="5" fill="rgba(0,200,255,0.8)"/>
        </svg>
        <svg class="eye-icon eye-right" viewBox="0 0 120 60" style="position:absolute; right:15%; top:50%; transform:translateY(-50%); width:120px; height:60px; opacity:0.5;">
          <ellipse cx="60" cy="30" rx="55" ry="25" fill="none" stroke="rgba(0,200,255,0.6)" stroke-width="2"/>
          <circle cx="60" cy="30" r="12" fill="rgba(0,200,255,0.4)"/>
          <circle cx="60" cy="30" r="5" fill="rgba(0,200,255,0.8)"/>
        </svg>
      </div>
      <div class="guide-text">여기에 두 눈을 맞추세요</div>
      <div class="guide-countdown"></div>
      <div class="guide-status">FACE DETECTION ACTIVE</div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="camWrap">
    <video id="cam" autoplay playsinline muted></video>
    <svg id="faceGuide" viewBox="0 0 120 160" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;pointer-events:none;">
      <!-- 얼굴 윤곽 -->
      <ellipse cx="60" cy="75" rx="42" ry="55" fill="none" stroke="rgba(0,255,0,0.4)" stroke-width="2"/>
      <!-- 왼쪽 눈 -->
      <ellipse cx="42" cy="58" rx="10" ry="5" fill="none" stroke="rgba(0,255,0,0.5)" stroke-width="1.5"/>
      <!-- 오른쪽 눈 -->
      <ellipse cx="78" cy="58" rx="10" ry="5" fill="none" stroke="rgba(0,255,0,0.5)" stroke-width="1.5"/>
      <!-- 코 -->
      <line x1="60" y1="65" x2="60" y2="82" stroke="rgba(0,255,0,0.3)" stroke-width="1.5"/>
      <line x1="55" y1="82" x2="65" y2="82" stroke="rgba(0,255,0,0.3)" stroke-width="1.5"/>
      <!-- 입 -->
      <ellipse cx="60" cy="96" rx="12" ry="5" fill="none" stroke="rgba(0,255,0,0.3)" stroke-width="1.5"/>
    </svg>
  </div>
  <div id="status"></div>

<script>
(function() {
  // ===== DOM =====
  const topbarEl  = document.getElementById('topbar');
  const debugEl   = document.getElementById('debug');
  const statusEl  = document.getElementById('status');
  const calibEl   = document.getElementById('calib');
  const calibDot  = document.getElementById('calibDot');
  const calibText = document.getElementById('calibText');
  const countdownBig = document.getElementById('countdownBig');
  const calibArrow = document.getElementById('calibArrow');
  const faceGuideOverlay = document.getElementById('faceGuideOverlay');
  const guideCountdownEl = faceGuideOverlay.querySelector('.guide-countdown');
  const guideCam = document.getElementById('guideCam');
  const meshCanvas = document.getElementById('meshCanvas');
  const meshCtx = meshCanvas.getContext('2d');
  const videoEl   = document.getElementById('cam');
  const cells     = Array.from(document.querySelectorAll('#grid .cell'));
  const toastEl   = document.getElementById('toast');
  const searchParams = new URLSearchParams(window.location.search);
  const EMBED_MODE = searchParams.get('embed') === '1';
  const AUTO_START = searchParams.get('autostart') === '1';
  const EMBED_USER_ID = (searchParams.get('userId') || '').trim();
  const EMBED_PROFILE_ID = (searchParams.get('profileId') || EMBED_USER_ID).trim();
  const RETURN_URL = (searchParams.get('returnUrl') || '').trim();
  const RETURN_REQUEST_ID = (searchParams.get('requestId') || '').trim();
  const MESSAGE_SOURCE = 'eyespeak-eye-tracking';
  const EMBED_MESSAGE_TYPES = Object.freeze({
    EMBED_LOADED: 'EMBED_LOADED',
    CALIBRATION_READY: 'CALIBRATION_READY',
    CALIBRATION_COMPLETE: 'CALIBRATION_COMPLETE',
    CALIBRATION_ERROR: 'CALIBRATION_ERROR'
  });
  const EMBED_LOG_PREFIX = '[eye-tracking-embed]';
  const DEFAULT_DWELL_TIME_SEC = 1.5;
  const SELECTION_COOLDOWN_MS = 500;
  const EMBED_API_BASE_URL = new URL('./', window.location.href);
  const PARENT_TARGET_ORIGIN = (() => {
    if (!document.referrer) {
      return '*';
    }

    try {
      return new URL(document.referrer).origin;
    } catch (error) {
      console.warn('Failed to resolve parent origin from referrer.', error);
      return '*';
    }
  })();

  // ===== 설정 =====
  const CALIB_N        = 12;      // 12포인트 캘리브레이션
  const CALIB_COLLECT_MS = 2000;  // 점당 2초 수집
  const CALIB_COUNTDOWN_SEC = 3;  // 각 점 수집 전 카운트다운
  const INERTIA_HOLD_MS = 260;    // 관성 전환 홀드

  // ===== 랜드마크 인덱스 =====
  const L_IRIS = [468,469,470,471,472];
  const R_IRIS = [473,474,475,476,477];
  const L_CA = 33, L_CB = 133, L_TOP = 159, L_BOT = 145;
  const R_CA = 362, R_CB = 263, R_TOP = 386, R_BOT = 374;

  // ===== 유틸 =====
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function buildApiUrl(path) {
    return new URL(path.replace(/^\/+/, ''), EMBED_API_BASE_URL).toString();
  }

  function notifyParent(type, detail = {}) {
    if (window.parent === window) {
      return;
    }
    console.info(EMBED_LOG_PREFIX, 'child message sent', {
      type,
      targetOrigin: PARENT_TARGET_ORIGIN,
      userId: EMBED_USER_ID || null,
      profileId: EMBED_PROFILE_ID || null,
      detail
    });
    window.parent.postMessage({
      source: MESSAGE_SOURCE,
      type,
      userId: EMBED_USER_ID || undefined,
      profileId: EMBED_PROFILE_ID || undefined,
      ...detail
    }, PARENT_TARGET_ORIGIN);
  }

  function buildReturnUrl(status, detail = {}) {
    if (!RETURN_URL) {
      return null;
    }

    try {
      const url = new URL(RETURN_URL, window.location.href);
      url.searchParams.set('calibrationStatus', status);

      if (RETURN_REQUEST_ID && !url.searchParams.get('requestId')) {
        url.searchParams.set('requestId', RETURN_REQUEST_ID);
      }

      if (detail.message) {
        url.searchParams.set('message', detail.message);
      } else {
        url.searchParams.delete('message');
      }

      return url.toString();
    } catch (error) {
      console.warn('Failed to build calibration return URL.', error);
      return null;
    }
  }

  function returnToFrontend(status, detail = {}) {
    const targetUrl = buildReturnUrl(status, detail);

    if (!targetUrl) {
      return false;
    }

    window.location.replace(targetUrl);
    return true;
  }

  function reportCalibrationError(message) {
    statusEl.textContent = message;
    showToast(message);
    notifyParent(EMBED_MESSAGE_TYPES.CALIBRATION_ERROR, { message });

    if (RETURN_URL) {
      window.setTimeout(() => {
        returnToFrontend('error', { message });
      }, 80);
    }
  }

  function handleCalibrationComplete() {
    statusEl.textContent = 'Calibration complete.';
    notifyParent(EMBED_MESSAGE_TYPES.CALIBRATION_COMPLETE);

    if (RETURN_URL) {
      window.setTimeout(() => {
        returnToFrontend('success');
      }, 80);
    }
  }

  if (EMBED_MODE && topbarEl) {
    topbarEl.style.display = 'none';
  }

  if (EMBED_MODE) {
    notifyParent(EMBED_MESSAGE_TYPES.EMBED_LOADED);
  }

  // ===== 얼굴 메시 와이어프레임 =====
  const FACE_MESH_TESSELATION = [
    // 주요 얼굴 윤곽 연결 (간략화)
    [10,338],[338,297],[297,332],[332,284],[284,251],[251,389],[389,356],[356,454],[454,323],[323,361],[361,288],
    [288,397],[397,365],[365,379],[379,378],[378,400],[400,377],[377,152],[152,148],[148,176],[176,149],[149,150],
    [150,136],[136,172],[172,58],[58,132],[132,93],[93,234],[234,127],[127,162],[162,21],[21,54],[54,103],[103,67],[67,109],[109,10],
    // 왼쪽 눈
    [33,7],[7,163],[163,144],[144,145],[145,153],[153,154],[154,155],[155,133],[133,173],[173,157],[157,158],[158,159],[159,160],[160,161],[161,246],[246,33],
    // 오른쪽 눈
    [362,382],[382,381],[381,380],[380,374],[374,373],[373,390],[390,249],[249,263],[263,466],[466,388],[388,387],[387,386],[386,385],[385,384],[384,398],[398,362],
    // 코
    [168,6],[6,197],[197,195],[195,5],[5,4],[4,1],[1,19],[19,94],[94,2],[2,164],
    // 입
    [61,146],[146,91],[91,181],[181,84],[84,17],[17,314],[314,405],[405,321],[321,375],[375,291],[291,409],[409,270],[270,269],[269,267],[267,0],[0,37],[37,39],[39,40],[40,185],[185,61],
    // 눈썹
    [70,63],[63,105],[105,66],[66,107],[107,55],[55,65],[65,52],[52,53],[53,46],
    [300,293],[293,334],[334,296],[296,336],[336,285],[285,295],[295,282],[282,283],[283,276]
  ];

  function drawFaceMesh(lm) {
    meshCanvas.width = window.innerWidth;
    meshCanvas.height = window.innerHeight;
    meshCtx.clearRect(0, 0, meshCanvas.width, meshCanvas.height);

    const w = meshCanvas.width, h = meshCanvas.height;

    // 선 그리기 (시안 와이어프레임)
    meshCtx.strokeStyle = 'rgba(0, 200, 255, 0.25)';
    meshCtx.lineWidth = 1;
    meshCtx.beginPath();
    for (const [a, b] of FACE_MESH_TESSELATION) {
      if (a < lm.length && b < lm.length) {
        const x1 = (1 - lm[a].x) * w, y1 = lm[a].y * h;  // 미러링 (1 - x)
        const x2 = (1 - lm[b].x) * w, y2 = lm[b].y * h;
        meshCtx.moveTo(x1, y1);
        meshCtx.lineTo(x2, y2);
      }
    }
    meshCtx.stroke();

    // 주요 포인트 (눈, 코, 입 주변 강조)
    const keyPoints = [
      // 왼눈 홍채
      468,469,470,471,472,
      // 오른눈 홍채
      473,474,475,476,477,
      // 눈 모서리
      33,133,362,263,
      // 코끝
      1,4,5,
      // 입 모서리
      61,291
    ];

    meshCtx.fillStyle = 'rgba(0, 200, 255, 0.8)';
    for (const i of keyPoints) {
      if (i < lm.length) {
        const x = (1 - lm[i].x) * w, y = lm[i].y * h;
        meshCtx.beginPath();
        meshCtx.arc(x, y, 3, 0, Math.PI * 2);
        meshCtx.fill();
      }
    }

    // 일반 포인트 (작게)
    meshCtx.fillStyle = 'rgba(0, 200, 255, 0.15)';
    const skipSet = new Set(keyPoints);
    for (let i = 0; i < Math.min(lm.length, 468); i += 3) { // 성능 고려: 샘플 간격 증가
      if (!skipSet.has(i)) {
        const x = (1 - lm[i].x) * w, y = lm[i].y * h;
        meshCtx.beginPath();
        meshCtx.arc(x, y, 1.5, 0, Math.PI * 2);
        meshCtx.fill();
      }
    }
  }

  // ===== 특징 추출 (레퍼런스와 동일) =====
  function meanPoint(lm, idxs) {
    let x = 0, y = 0;
    for (const i of idxs) { x += lm[i].x; y += lm[i].y; }
    return { x: x / idxs.length, y: y / idxs.length };
  }
  function normInEyeBox(lm, irisIdxs, cA, cB, topI, botI) {
    const iris = meanPoint(lm, irisIdxs);
    const a = lm[cA], b = lm[cB], t = lm[topI], bo = lm[botI];
    const xMin = Math.min(a.x, b.x), xMax = Math.max(a.x, b.x);
    const yMin = Math.min(t.y, bo.y), yMax = Math.max(t.y, bo.y);
    const w = Math.max(1e-6, xMax - xMin), h = Math.max(1e-6, yMax - yMin);
    const nx = (iris.x - xMin) / w, ny = (iris.y - yMin) / h;
    return { nx: Math.max(-0.5, Math.min(1.5, nx)), ny: Math.max(-0.5, Math.min(1.5, ny)) };
  }
  function getGazeNorm(lm) {
    const L = normInEyeBox(lm, L_IRIS, L_CA, L_CB, L_TOP, L_BOT);
    const R = normInEyeBox(lm, R_IRIS, R_CA, R_CB, R_TOP, R_BOT);
    return { xNorm: (L.nx + R.nx) / 2, yNorm: (L.ny + R.ny) / 2 };
  }

  // ===== EAR (Eye Aspect Ratio) =====
  const EAR_LEFT  = { top: [159, 160, 161], bot: [145, 144, 153], inner: 133, outer: 33 };
  const EAR_RIGHT = { top: [386, 385, 384], bot: [374, 373, 380], inner: 362, outer: 263 };

  function computeEAR(lm, eye) {
    let vSum = 0;
    for (let i = 0; i < 3; i++) {
      const t = lm[eye.top[i]], b = lm[eye.bot[i]];
      vSum += Math.hypot(t.x - b.x, t.y - b.y);
    }
    const hDist = Math.hypot(lm[eye.outer].x - lm[eye.inner].x,
                              lm[eye.outer].y - lm[eye.inner].y);
    return hDist > 1e-6 ? vSum / (2 * hDist) : 0.3;
  }

  function getEAR(lm) {
    return (computeEAR(lm, EAR_LEFT) + computeEAR(lm, EAR_RIGHT)) / 2;
  }

  // ===== TriggerDetector (JS mirror of Ai_eyetracking/trigger_detector.py) =====
  const BLINK_SELECT_MIN_SEC = 0.3;
  const BLINK_SELECT_MAX_SEC = 1.0;
  const DOUBLE_BLINK_WINDOW_SEC = 2.0;
  const LONG_CLOSE_SEC = 3.0;
  const TRIPLE_BLINK_WINDOW_SEC = 3.0;

  const trigger = {
    threshold: 0.18,
    eyesClosed: false,
    closeStartTime: 0,
    blinkHistory: [],
    stopFired: false,

    update(ear, timestamp) {
      this.blinkHistory = this.blinkHistory.filter(b => timestamp - b.time <= 5.0);
      const isClosed = ear < this.threshold;
      if (isClosed && !this.eyesClosed) {
        this.eyesClosed = true;
        this.closeStartTime = timestamp;
        this.stopFired = false;
        return 'none';
      }
      if (isClosed && this.eyesClosed) {
        const duration = timestamp - this.closeStartTime;
        if (duration >= LONG_CLOSE_SEC && !this.stopFired) {
          this.stopFired = true;
          return 'stop';
        }
        return 'none';
      }
      if (!isClosed && this.eyesClosed) {
        this.eyesClosed = false;
        const duration = timestamp - this.closeStartTime;
        if (this.stopFired) {
          this.stopFired = false;
          this.blinkHistory = [];
          return 'none';
        }
        if (duration >= BLINK_SELECT_MIN_SEC && duration <= BLINK_SELECT_MAX_SEC) {
          this.blinkHistory.push({ time: timestamp, duration });
          return this._checkMultiBlink(timestamp);
        }
        return 'none';
      }
      return 'none';
    },

    _checkMultiBlink(timestamp) {
      const recent3s = this.blinkHistory.filter(b => timestamp - b.time <= TRIPLE_BLINK_WINDOW_SEC);
      const recent2s = this.blinkHistory.filter(b => timestamp - b.time <= DOUBLE_BLINK_WINDOW_SEC);
      if (recent3s.length >= 3) { this.blinkHistory = []; return 'sos'; }
      if (recent2s.length >= 2) { this.blinkHistory = []; return 'start'; }
      return 'select';
    },

    setThreshold(t) { this.threshold = t; },
    reset() {
      this.eyesClosed = false;
      this.closeStartTime = 0;
      this.blinkHistory = [];
      this.stopFired = false;
    }
  };

  // ===== 상태 =====
  let systemState = 'IDLE';  // 'IDLE' | 'ACTIVE' | 'CALIBRATING'
  let coef = null;  // 캘리 다항식 계수
  let earSamples = [];
  let calibCountdownStart = 0;
  let calibCounting = true;  // true=카운트다운 중, false=수집 중
  let faceGuidePhase = false;   // true = 얼굴 가이드 표시 중
  let faceGuideStart = 0;
  const FACE_GUIDE_SEC = 5;     // 얼굴 가이드 표시 시간 (5초)
  let gazeIdx = -1, gazeSince = 0;
  let dwellLockedIdx = -1;
  let lastSelectionAt = 0;
  let dwellTimeSec = DEFAULT_DWELL_TIME_SEC;
  let gazeProgressMaxMs = DEFAULT_DWELL_TIME_SEC * 1000;
  let inertiaState = { lastIdx: -1, candidateIdx: -1, candidateSince: 0 };
  let calibIdx = 0, calibData = [], lastCalibCollect = 0;
  let cam = null;
  let autoStartRequested = false;
  cells.forEach(c => c.classList.add('dimmed'));

  // ===== 셀 중심 좌표 =====
  function getTileCenters() {
    return cells.map(c => {
      const r = c.getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height / 2];
    });
  }

  // ===== UI =====
  function setHot(idx) {
    cells.forEach((c, i) => {
      c.classList.toggle('hot', i === idx);
      if (i !== idx) c.querySelector('.progress').style.width = '0%';
    });
  }
  function flashSelected(idx) {
    cells[idx].classList.add('selected');
    setTimeout(() => cells[idx].classList.remove('selected'), 800);
  }
  function resetGazeSelectionState(clearHot = false) {
    gazeIdx = -1;
    gazeSince = 0;
    dwellLockedIdx = -1;
    cells.forEach(c => c.querySelector('.progress').style.width = '0%');
    if (clearHot) {
      cells.forEach(c => c.classList.remove('hot'));
    }
  }
  function setSystemState(nextState) {
    systemState = nextState;
    if (nextState === 'ACTIVE') {
      cells.forEach(c => c.classList.remove('dimmed'));
      return;
    }
    cells.forEach(c => c.classList.add('dimmed'));
    setHot(-1);
    resetGazeSelectionState(false);
  }
  function findCellIndexFromPoint(x, y) {
    for (let i = 0; i < cells.length; i++) {
      const rect = cells[i].getBoundingClientRect();
      if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
        return i;
      }
    }
    return -1;
  }
  function persistSelection(idx, source) {
    if (source !== 'dwell') {
      return;
    }
    fetch(buildApiUrl('api/selection'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cell: idx })
    }).catch(() => {});
  }
  function commitSelection(idx, source) {
    if (systemState !== 'ACTIVE' || idx < 0 || idx >= cells.length) {
      return false;
    }
    const nowMs = performance.now();
    if (nowMs - lastSelectionAt < SELECTION_COOLDOWN_MS) {
      return false;
    }
    lastSelectionAt = nowMs;
    dwellLockedIdx = idx;
    cells[idx].querySelector('.progress').style.width = '100%';
    flashSelected(idx);
    showToast((idx + 1) + '번 선택!');
    notifyParent('cell-selected', { cell: idx, cellNumber: idx + 1, source });
    persistSelection(idx, source);
    return true;
  }
  async function loadRuntimeConfig() {
    try {
      const response = await fetch(buildApiUrl('api/runtime-config'));
      const result = await response.json().catch(() => ({}));
      const nextDwellTimeSec = Number(result && result.dwell_time_sec);
      if (response.ok && Number.isFinite(nextDwellTimeSec) && nextDwellTimeSec > 0) {
        dwellTimeSec = nextDwellTimeSec;
        gazeProgressMaxMs = dwellTimeSec * 1000;
      }
    } catch (error) {
      console.warn('Runtime config load failed, using defaults.', error);
    }
  }

  // ===== 캘리브레이션 =====
  function getCalibPx() {
    return CalibrationRegion.getCalibPointsPx(CALIB_N, window.innerWidth, window.innerHeight)[calibIdx];
  }

  function startCalibration() {
    systemState = 'CALIBRATING';
    document.getElementById('camWrap').classList.add('guiding');
    calibIdx = 0;
    calibData = [];
    calibCounting = false;
    calibCountdownStart = 0;
    earSamples = [];
    coef = null;
    lastSelectionAt = 0;
    inertiaState = { lastIdx: -1, candidateIdx: -1, candidateSince: 0 };
    resetGazeSelectionState(true);
    cells.forEach(c => { c.classList.remove('hot', 'selected'); c.querySelector('.progress').style.width = '0%'; });

    calibEl.classList.add('show');
    countdownBig.classList.remove('show');
    calibArrow.classList.remove('show');
    statusEl.textContent = '얼굴을 맞춰주세요…';

    // ★ 얼굴 가이드 페이즈(5초) 먼저 표시
    faceGuidePhase = true;
    faceGuideStart = Date.now();
    faceGuideOverlay.classList.add('show');
    // ★ 웹캠 스트림을 guideCam에 연결 (MediaPipe #cam은 그대로 사용)
    if (videoEl.srcObject) {
      guideCam.srcObject = videoEl.srcObject;
    }
    calibDot.style.display = 'none';
    calibText.style.display = 'none';
    document.getElementById('btnCal').disabled = true;
  }

  async function finalizeCalibrationSession() {
    const calibrationPayload = calibData.map(d => ({ rx: d.xNorm, ry: d.yNorm }));

    try {
      statusEl.textContent = EMBED_USER_ID ? 'Saving calibration...' : 'Syncing calibration...';

      const calibrateResponse = await fetch(buildApiUrl('api/calibrate'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ calibration: calibrationPayload })
      });
      const calibrateResult = await calibrateResponse.json().catch(() => ({}));

      if (!calibrateResponse.ok || !calibrateResult.ok) {
        throw new Error(calibrateResult.error || 'Calibration sync failed.');
      }

      if (EMBED_USER_ID) {
        const saveResponse = await fetch(buildApiUrl('api/calibrate/save'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: EMBED_USER_ID })
        });
        const saveResult = await saveResponse.json().catch(() => ({}));

        if (!saveResponse.ok || !saveResult.ok) {
          throw new Error(saveResult.error || 'Calibration save failed.');
        }

        await fetch(buildApiUrl('api/calibrate/load'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: EMBED_USER_ID })
        }).catch(() => {});
      }

      handleCalibrationComplete();
    } catch (error) {
      const message =
        error instanceof Error ? error.message : 'Calibration sync failed.';
      console.warn(message, error);
      reportCalibrationError(message);
    }
  }

  function collectCalibSample(xNorm, yNorm) {
    const pt = getCalibPx();
    calibData.push({ screenX: pt.x, screenY: pt.y, xNorm, yNorm });
    calibIdx++;

    if (calibIdx >= CALIB_N) {
      // 다항식 피팅
      coef = CalibrationRegion.fitPolynomialCalibration(calibData);
      if (earSamples.length > 0) {
        const mean = earSamples.reduce((a, b) => a + b, 0) / earSamples.length;
        trigger.setThreshold(Math.max(0.10, mean * 0.6));
      }
      setSystemState('ACTIVE');
      calibEl.classList.remove('show');
      countdownBig.classList.remove('show');
      calibArrow.classList.remove('show');
      document.getElementById('camWrap').classList.remove('guiding');
      document.getElementById('btnCal').disabled = false;
      statusEl.textContent = '캘리브레이션 완료! 바로 선택할 수 있습니다.';
      showToast('캘리브레이션 완료');
      setTimeout(() => statusEl.textContent = '', 2000);

      void finalizeCalibrationSession();
      return;
    }

    calibText.textContent = '포인트 ' + (calibIdx + 1) + ' / ' + CALIB_N + ' — 다음 점을 응시하세요';
    const next = CalibrationRegion.getCalibPointsPx(CALIB_N, window.innerWidth, window.innerHeight)[calibIdx];
    calibDot.style.left = next.x + 'px';
    calibDot.style.top = next.y + 'px';
    calibCounting = true;
    calibCountdownStart = Date.now();
  }

  // ===== MediaPipe 결과 콜백 =====
  function onResults(results) {
    const hasFace = results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0;

    if (!hasFace) {
      resetGazeSelectionState(true);
      debugEl.textContent = '얼굴 없음 — 카메라를 정면으로 봐주세요';
      if (calibEl.classList.contains('show')) {
        calibText.textContent = '⚠ 얼굴을 인식할 수 없습니다 — 카메라를 봐주세요';
      }
      return;
    }

    // ★ 핵심: x축 미러링 (1 - p.x) — 레퍼런스와 동일
    const lm = results.multiFaceLandmarks[0].map(p => ({ x: 1 - p.x, y: p.y }));

    // 캘리브레이션 모드
    if (calibEl.classList.contains('show')) {
      const now = Date.now();

      // ★ 얼굴 가이드 페이즈(첫 캘리 포인트 전)
      if (faceGuidePhase) {
        const elapsed = (now - faceGuideStart) / 1000;
        const remaining = Math.ceil(FACE_GUIDE_SEC - elapsed);
        guideCountdownEl.textContent = remaining > 0 ? remaining + '초 후 시작…' : '시작!';
        debugEl.textContent = '얼굴 스캐닝 — ' + remaining + '초 남음';

        // ★ 얼굴 메시 와이어프레임 그리기 (원본 lm 사용 — 미러링은 drawFaceMesh 내부에서)
        drawFaceMesh(results.multiFaceLandmarks[0]);

        if (elapsed >= FACE_GUIDE_SEC) {
          // 가이드 종료 → 첫 번째 캘리 포인트 시작
          faceGuidePhase = false;
          faceGuideOverlay.classList.remove('show');
          guideCam.srcObject = null;  // 스트림 연결 해제
          meshCtx.clearRect(0, 0, meshCanvas.width, meshCanvas.height);
          calibDot.style.display = '';
          calibText.style.display = '';
          calibCounting = true;
          calibCountdownStart = Date.now();
          calibText.textContent = '포인트 1 / ' + CALIB_N + ' — ' + CALIB_COUNTDOWN_SEC + '...';
          const pt = getCalibPx();
          calibDot.style.left = pt.x + 'px';
          calibDot.style.top = pt.y + 'px';
          statusEl.textContent = '캘리브레이션 중…';
        }
        return;
      }

      if (calibCounting) {
        const elapsed = (now - calibCountdownStart) / 1000;
        const remaining = Math.max(0, CALIB_COUNTDOWN_SEC - elapsed);
        const count = Math.ceil(remaining);

        if (count > 0) {
          // 큰 숫자 표시
          const newText = String(count);
          if (countdownBig.textContent !== newText) {
            countdownBig.textContent = newText;
            countdownBig.classList.remove('show');
            void countdownBig.offsetWidth;
            countdownBig.classList.add('show');
          }
          // 화살표: 중앙→calibDot 방향 75% 지점(도트 가까이), 도트 방향으로 회전
          const pt0 = getCalibPx();
          const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
          const midX = cx + (pt0.x - cx) * 0.75, midY = cy + (pt0.y - cy) * 0.75;
          const angle = Math.atan2(pt0.y - cy, pt0.x - cx);
          calibArrow.style.left = (midX - 40) + 'px';
          calibArrow.style.top = (midY - 40) + 'px';
          calibArrow.style.setProperty('--arrow-angle', (angle + Math.PI / 2) + 'rad');
          calibArrow.style.animation = 'arrowFloat 1.2s ease-in-out infinite';
          calibArrow.classList.add('show');
          calibText.textContent = '포인트 ' + (calibIdx + 1) + ' / ' + CALIB_N + ' — ' + count + '...';
        } else {
          // 카운트다운 끝 → "바라보세요!" + 화살표
          countdownBig.textContent = '';
          countdownBig.classList.remove('show');
          void countdownBig.offsetWidth;
          countdownBig.classList.add('show');

          const pt = getCalibPx();
          const cx2 = window.innerWidth / 2, cy2 = window.innerHeight / 2;
          const midX2 = cx2 + (pt.x - cx2) * 0.75, midY2 = cy2 + (pt.y - cy2) * 0.75;
          const angle2 = Math.atan2(pt.y - cy2, pt.x - cx2);
          calibArrow.style.left = (midX2 - 40) + 'px';
          calibArrow.style.top = (midY2 - 40) + 'px';
          calibArrow.style.setProperty('--arrow-angle', (angle2 + Math.PI / 2) + 'rad');
          calibArrow.style.animation = 'arrowFloat 1.2s ease-in-out infinite';
          calibArrow.classList.add('show');

          calibText.textContent = '포인트 ' + (calibIdx + 1) + ' / ' + CALIB_N + ' — 여기를 보세요!';
        }

        debugEl.textContent = '얼굴 OK — 카운트다운 ' + count;

        if (elapsed >= CALIB_COUNTDOWN_SEC) {
          calibCounting = false;
          lastCalibCollect = Date.now();
          countdownBig.classList.remove('show');
          calibArrow.classList.remove('show');
        }
        return;
      }

      // 수집 단계
      const ear = getEAR(lm);
      earSamples.push(ear);
      const remaining = Math.max(0, CALIB_COLLECT_MS - (now - lastCalibCollect));
      calibText.textContent = '포인트 ' + (calibIdx + 1) + ' / ' + CALIB_N +
        ' — 여기를 보세요! (' + Math.ceil(remaining / 1000) + '초)';
      debugEl.textContent = '얼굴 OK — 데이터 수집 중';

      if (now - lastCalibCollect >= CALIB_COLLECT_MS) {
        const g = getGazeNorm(lm);
        collectCalibSample(g.xNorm, g.yNorm);
      }
      return;
    }

    // 캘리 없으면 대기
    if (!coef) {
      resetGazeSelectionState(true);
      debugEl.textContent = '캘리브레이션 버튼을 눌러주세요';
      return;
    }

    // 시선 예측
    const g = getGazeNorm(lm);
    const screen = CalibrationRegion.predictScreenPolynomial(
      g.xNorm, g.yNorm, coef.cx, coef.cy, window.innerWidth, window.innerHeight
    );

    // EAR + 트리거
    const ear = getEAR(lm);
    const now_sec = performance.now() / 1000;
    const trig = (systemState !== 'CALIBRATING') ? trigger.update(ear, now_sec) : 'none';
    const idx = findCellIndexFromPoint(screen.x, screen.y);
    let stableIdx = -1;

    if (idx >= 0) {
      const result = CalibrationRegion.applyInertia(idx, inertiaState, performance.now(), { holdMs: INERTIA_HOLD_MS });
      inertiaState = result.state;
      stableIdx = result.idx;
    } else {
      inertiaState = { lastIdx: -1, candidateIdx: -1, candidateSince: 0 };
      resetGazeSelectionState(true);
    }

    if (systemState === 'ACTIVE' && stableIdx >= 0) {
      setHot(stableIdx);
    } else {
      setHot(-1);
      resetGazeSelectionState(false);
    }
    debugEl.textContent =
      `셀:${stableIdx >= 0 ? stableIdx + 1 : '-'} | 시선:(${Math.round(screen.x)},${Math.round(screen.y)}) | EAR:${ear.toFixed(3)} | 트리거:${trig} | 응시:${dwellTimeSec.toFixed(1)}s | 상태:${systemState}`;

    // 연속 응시 progress bar
    const nowMs = performance.now();
    if (systemState !== 'ACTIVE' || stableIdx < 0) {
      resetGazeSelectionState(false);
    } else if (stableIdx !== gazeIdx) {
      gazeIdx = stableIdx;
      gazeSince = nowMs;
      dwellLockedIdx = -1;
      cells.forEach(c => c.querySelector('.progress').style.width = '0%');
    } else {
      const elapsed = nowMs - gazeSince;
      const pct = Math.min(100, (elapsed / gazeProgressMaxMs) * 100);
      cells[stableIdx].querySelector('.progress').style.width = pct + '%';
      if (elapsed >= gazeProgressMaxMs && dwellLockedIdx !== stableIdx) {
        commitSelection(stableIdx, 'dwell');
      }
    }

    // 트리거 처리
    if (trig === 'select' && systemState === 'ACTIVE') {
      commitSelection(stableIdx, 'blink');
    } else if (trig === 'start' && systemState === 'IDLE') {
      setSystemState('ACTIVE');
      showToast('시스템 시작');
    } else if (trig === 'stop' && systemState === 'ACTIVE') {
      setSystemState('IDLE');
      showToast('시스템 정지');
    } else if (trig === 'sos') {
      showToast('🆘 SOS 긴급!');
    }
  }

  // ===== 버튼 이벤트 =====
  document.getElementById('btnCal').addEventListener('click', () => {
    if (!cam || !faceMesh) { showToast('카메라/MediaPipe 로딩 중… 잠시 기다려주세요'); return; }
    startCalibration();
  });

  document.getElementById('btnSave').addEventListener('click', () => {
    const userId = prompt('저장할 사용자 ID를 입력하세요:');
    if (!userId) return;
    fetch(buildApiUrl('api/calibrate/save'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId })
    })
      .then(r => r.json())
      .then(d => showToast(d.ok ? '저장 완료: ' + userId : '저장 실패'))
      .catch(() => showToast('서버 연결 실패'));
  });

  document.getElementById('btnLoad').addEventListener('click', () => {
    const userId = prompt('불러올 사용자 ID를 입력하세요:');
    if (!userId) return;
    fetch(buildApiUrl('api/calibrate/load'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId })
    })
      .then(r => r.json())
      .then(d => {
        if (d.ok) {
          if (Array.isArray(d.poly_coeff_x) && Array.isArray(d.poly_coeff_y)) {
            coef = { cx: d.poly_coeff_x, cy: d.poly_coeff_y };
          }
          showToast('불러오기 완료: ' + userId);
          setSystemState('ACTIVE');
        } else {
          showToast('불러오기 실패: 데이터 없음');
        }
      })
      .catch(() => showToast('서버 연결 실패'));
  });

  document.getElementById('btnFullscreen').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    // Esc 복귀 시에는 브라우저가 fullscreen 상태를 토글하므로 CSS만으로 처리됩니다.
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    trigger.reset();
    earSamples = [];
    setSystemState('IDLE');
    faceGuidePhase = false;
    faceGuideOverlay.classList.remove('show');
    guideCam.srcObject = null;
    meshCtx.clearRect(0, 0, meshCanvas.width, meshCanvas.height);
    countdownBig.classList.remove('show');
    calibArrow.classList.remove('show');
    calibDot.style.display = '';
    calibText.style.display = '';
    document.getElementById('camWrap').classList.remove('guiding');
    cells.forEach(c => { c.classList.add('dimmed'); c.classList.remove('hot', 'selected'); c.querySelector('.progress').style.width = '0%'; });
    coef = null;
    lastSelectionAt = 0;
    inertiaState = { lastIdx: -1, candidateIdx: -1, candidateSince: 0 };
    showToast('캘리 초기화됨');
  });

  // ===== 초기화: MediaPipe + 카메라 =====
  let faceMesh = null;

  async function initMediaPipe() {
    console.info(EMBED_LOG_PREFIX, 'camera init start', {
      autostart: AUTO_START,
      embedMode: EMBED_MODE
    });
    console.info(EMBED_LOG_PREFIX, 'detector init start');
    debugEl.textContent = 'MediaPipe 로딩 중… (처음엔 수 초 걸림)';
    statusEl.textContent = '초기화 중…';
    try {
      faceMesh = new FaceMesh({
        locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f
      });
      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      faceMesh.onResults(onResults);

      debugEl.textContent = '카메라 시작 중…';
      cam = new Camera(videoEl, {
        onFrame: async () => { await faceMesh.send({ image: videoEl }); },
        width: 640,
        height: 480
      });
      await cam.start();
      console.info(EMBED_LOG_PREFIX, 'camera init success');
      console.info(EMBED_LOG_PREFIX, 'detector init success');
      notifyParent(EMBED_MESSAGE_TYPES.CALIBRATION_READY);
      if (AUTO_START && !autoStartRequested) {
        autoStartRequested = true;
        startCalibration();
      }
      debugEl.textContent = coef ? '이전 캘리 불러옴 — 바로 사용 가능' : '카메라 준비됨 — 캘리브레이션 버튼을 눌러주세요';
      statusEl.textContent = '';
    } catch(e) {
      console.error(EMBED_LOG_PREFIX, 'camera or detector init failed', e);
      debugEl.textContent = '초기화 오류: ' + e.message;
      statusEl.textContent = '오류 발생 — 페이지를 새로고침하세요';
      reportCalibrationError(e && e.message ? e.message : 'MediaPipe init failed.');
      console.error('MediaPipe init error:', e);
    }
  }

  // CDN 스크립트가 로드된 후 초기화
  void loadRuntimeConfig();
  if (typeof FaceMesh !== 'undefined' && typeof Camera !== 'undefined') {
    initMediaPipe();
  } else {
    debugEl.textContent = 'CDN 스크립트 로딩 대기 중…';
    window.addEventListener('load', () => {
      if (typeof FaceMesh !== 'undefined' && typeof Camera !== 'undefined') {
        initMediaPipe();
      } else {
        debugEl.textContent = '❌ MediaPipe CDN 로드 실패 — 인터넷 연결을 확인하세요';
      }
    });
  }
  window.addEventListener('load', () => {
    if (typeof FaceMesh === 'undefined' || typeof Camera === 'undefined') {
      reportCalibrationError('MediaPipe CDN scripts failed to load.');
    }
  });
})();
</script>
</body>
</html>
