<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소리 없는 목소리 - ALS 환자 의사소통 보조</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
        }

        /* ── 상단 헤더 ── */
        .header {
            height: 48px;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            font-size: 18px;
            font-weight: 700;
            color: #e94560;
        }

        .header-patient {
            font-size: 13px;
            color: #8899aa;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-time {
            font-size: 14px;
            color: #e0e0e0;
            font-weight: 500;
        }

        .btn-blink-home {
            position: fixed;
            top: 8px;
            right: 16px;
            z-index: 999;
            padding: 6px 14px;
            border-radius: 8px;
            border: 2px solid #e94560;
            background: rgba(22, 33, 62, 0.95);
            color: #e94560;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-blink-home:hover {
            background: #e94560;
            color: #fff;
        }

        /* ── 메인 4분할 그리드 ── */
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            padding: 6px;
        }

        .quadrant {
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .quadrant:hover {
            transform: scale(0.98);
            filter: brightness(1.1);
        }

        .quadrant:active {
            transform: scale(0.96);
        }

        /* 각 사분면 색상 */
        .q-call {
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            border: 3px solid #ff6b81;
        }

        .q-special {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            border: 3px solid #3a7bd5;
        }

        .q-extended {
            background: linear-gradient(135deg, #1a6b3c 0%, #0d4d2b 100%);
            border: 3px solid #2ecc71;
        }

        .q-custom {
            background: linear-gradient(135deg, #6c3483 0%, #4a235a 100%);
            border: 3px solid #a569bd;
        }

        /* 사분면 내부 콘텐츠 */
        .q-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .q-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            text-align: center;
        }

        .q-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            line-height: 1.4;
        }

        /* 호출 버튼 맥동 효과 */
        .q-call::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%) scale(0);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        /* ── 특화 소통 서브페이지 ── */
        .subpage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a1a2e;
            z-index: 100;
            flex-direction: column;
        }

        .subpage.active {
            display: flex;
        }

        .sub-header {
            height: 48px;
            background: #16213e;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
        }

        .btn-back {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid #e94560;
            background: transparent;
            color: #e94560;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .btn-back:hover {
            background: #e94560;
            color: #fff;
        }

        .sub-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        /* ── 4분할 공통 그리드 (특화 소통 전용) ── */
        .quad-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            padding: 6px;
        }

        .quad-item {
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 3px solid transparent;
        }

        .quad-item:hover {
            transform: scale(0.97);
            filter: brightness(1.1);
        }

        .quad-item .q-item-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .quad-item .q-item-label {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        /* 카테고리 색상 */
        .qi-meal       { background: linear-gradient(135deg, #e67e22, #d35400); border-color: #f39c12; }
        .qi-drink      { background: linear-gradient(135deg, #3498db, #2471a3); border-color: #5dade2; }
        .qi-toilet     { background: linear-gradient(135deg, #1abc9c, #148f77); border-color: #48c9b0; }
        .qi-hygiene    { background: linear-gradient(135deg, #5dade2, #2e86c1); border-color: #85c1e9; }
        .qi-sleep      { background: linear-gradient(135deg, #2c3e50, #1a252f); border-color: #5d6d7e; }
        .qi-environ    { background: linear-gradient(135deg, #27ae60, #1e8449); border-color: #58d68d; }
        .qi-posture    { background: linear-gradient(135deg, #8e44ad, #6c3483); border-color: #af7ac5; }
        .qi-pain       { background: linear-gradient(135deg, #e74c3c, #c0392b); border-color: #f1948a; }
        .qi-response   { background: linear-gradient(135deg, #f39c12, #d4ac0d); border-color: #f7dc6f; }

        /* 불편 부위 전용 색상 */
        .qi-pain-area  { background: linear-gradient(135deg, #c0392b, #922b21); border-color: #e74c3c; }
        .qi-pain-level { background: linear-gradient(135deg, #d35400, #a04000); border-color: #e67e22; }

        /* "다른 소통" 네비게이션 버튼 */
        .qi-next {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border-color: #5d6d7e;
        }

        .qi-next .q-item-label {
            color: #8899aa;
        }

        /* ── 표현 목록도 4분할 ── */
        .quad-expr {
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 3px solid rgba(255,255,255,0.2);
            background: #16213e;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            padding: 12px;
        }

        .quad-expr:hover {
            background: #0f3460;
            border-color: #3a7bd5;
            transform: scale(0.97);
        }

        .quad-expr-next {
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 3px solid #5d6d7e;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: #8899aa;
            font-size: 20px;
            font-weight: 600;
        }

        .quad-expr-next:hover {
            border-color: #8899aa;
            color: #fff;
            transform: scale(0.97);
        }

        .quad-expr-next .next-icon {
            font-size: 36px;
            margin-bottom: 4px;
        }

        /* ── 확장 소통 — 빌더 전용 스타일 ── */
        .qi-builder-rec {
            background: linear-gradient(135deg, #1a6b3c, #145a32);
            border-color: #2ecc71;
        }

        .qi-builder-rec .q-item-icon {
            font-size: 20px;
            color: #2ecc71;
            margin-bottom: 6px;
        }

        .qi-builder {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border-color: #2ecc71;
        }

        .qi-builder-result {
            background: linear-gradient(135deg, #1a6b3c, #145a32);
            border-color: #58d68d;
        }

        .qi-builder-result .q-item-label {
            font-size: 20px;
        }

        .qi-builder-reset {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border-color: #5d6d7e;
        }

        .qi-builder-reset .q-item-label {
            color: #8899aa;
        }

        .qi-builder-topic {
            background: linear-gradient(135deg, #1a6b3c, #145a32);
            border-color: #2ecc71;
        }

        /* ── 호출 피드백 오버레이 ── */
        .call-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(233, 69, 96, 0.95);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: flashIn 0.3s ease;
        }

        .call-overlay.active {
            display: flex;
        }

        @keyframes flashIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .call-status-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .call-status-text {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .call-status-sub {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
        }

        .call-cancel-btn {
            margin-top: 40px;
            padding: 16px 48px;
            border-radius: 12px;
            border: 3px solid #fff;
            background: transparent;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ── 설계 근거 버튼 ── */
        .btn-rationale {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 998;
            padding: 5px 16px;
            border-radius: 6px;
            border: 1px solid #5d6d7e;
            background: rgba(22, 33, 62, 0.9);
            color: #8899aa;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-rationale:hover {
            border-color: #f39c12;
            color: #f39c12;
        }

        /* ── 근거 모달 ── */
        .rationale-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .rationale-overlay.active {
            display: flex;
        }

        .rationale-box {
            width: 90%;
            max-width: 640px;
            max-height: 80vh;
            background: #16213e;
            border: 2px solid #f39c12;
            border-radius: 16px;
            padding: 28px 24px;
            overflow-y: auto;
            position: relative;
        }

        .rationale-box h2 {
            color: #f39c12;
            font-size: 20px;
            margin-bottom: 16px;
            padding-right: 40px;
        }

        .rationale-box h3 {
            color: #e0e0e0;
            font-size: 15px;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        .rationale-box h4 {
            color: #d4d4d4;
            font-size: 14px;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        .rationale-box p, .rationale-box li {
            color: #aab;
            font-size: 13px;
            line-height: 1.7;
        }

        .rationale-box strong {
            color: #ffffff;
        }

        .rationale-box ul {
            padding-left: 20px;
            margin-bottom: 8px;
        }

        .rationale-box .source-tag {
            display: inline-block;
            background: #0f3460;
            color: #5dade2;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 4px;
        }

        .btn-close-rationale {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid #e94560;
            background: transparent;
            color: #e94560;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close-rationale:hover {
            background: #e94560;
            color: #fff;
        }

        /* ── 커스텀 서브페이지 ── */
        .custom-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            padding: 6px;
        }

        .custom-item {
            border-radius: 12px;
            background: #16213e;
            border: 2px dashed #a569bd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            color: #a569bd;
        }

        .custom-item:hover {
            border-style: solid;
            background: #1a1a3e;
        }

        .custom-item .c-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .custom-item .c-label {
            font-size: 18px;
            font-weight: 600;
        }

        .custom-item .c-desc {
            font-size: 12px;
            margin-top: 4px;
            color: rgba(165, 105, 189, 0.6);
        }

        .custom-item.has-content {
            border-style: solid;
            color: #d7bde2;
        }

        /* ── 선택 피드백 ── */
        .select-feedback {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(46, 204, 113, 0.95);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            padding: 24px 48px;
            border-radius: 16px;
            z-index: 300;
            animation: feedbackPop 0.3s ease;
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- ══════ 메인 페이지 ══════ -->
    <div id="mainPage">
        <div class="header">
            <div class="header-left"></div>
            <div class="header-time" id="headerTime">14:35</div>
        </div>

        <div class="main-grid">
            <!-- 1. 호출 -->
            <div class="quadrant q-call" onclick="triggerCall()">
                <div class="q-icon">🔔</div>
                <div class="q-title">호출</div>
                <div class="q-desc">보호자에게 알림 전송</div>
            </div>

            <!-- 2. 특화 소통 -->
            <div class="quadrant q-special" onclick="enterSpecial()">
                <div class="q-icon">💬</div>
                <div class="q-title">특화 소통</div>
                <div class="q-desc">식사 · 화장실 · 통증 등<br>자주 쓰는 표현</div>
            </div>

            <!-- 3. 확장 소통 -->
            <div class="quadrant q-extended" onclick="renderExtendedPage()">
                <div class="q-icon">🤖</div>
                <div class="q-title">확장 소통</div>
                <div class="q-desc">AI가 지금 상황에 맞는<br>표현을 추천합니다</div>
            </div>

            <!-- 4. 커스텀 -->
            <div class="quadrant q-custom" onclick="showPage('customPage')">
                <div class="q-icon">⚙️</div>
                <div class="q-title">커스텀</div>
                <div class="q-desc">보호자가 설정한<br>나만의 기능</div>
            </div>
        </div>
    </div>

    <!-- ══════ 호출 피드백 ══════ -->
    <div class="call-overlay" id="callOverlay">
        <div class="call-status-icon">📡</div>
        <div class="call-status-text">보호자에게 알림을 보냈습니다</div>
        <div class="call-status-sub">잠시만 기다려 주세요</div>
        <button class="call-cancel-btn" onclick="hideCall()">돌아가기</button>
    </div>

    <!-- ══════ 특화 소통 (JS로 4분할 페이지네이션 렌더링) ══════ -->
    <div class="subpage" id="specialPage">
        <div class="sub-header">
            <div class="sub-title">특화 소통</div>
        </div>
        <div class="quad-grid" id="specialGrid">
            <!-- JS로 채움 -->
        </div>
    </div>

    <!-- ══════ 특화 소통 - 표현 목록 (4분할) ══════ -->
    <div class="subpage" id="exprPage">
        <div class="sub-header">
            <div class="sub-title" id="exprPageTitle">식사</div>
        </div>
        <div class="quad-grid" id="exprGrid">
            <!-- JS로 채움 -->
        </div>
    </div>

    <!-- ══════ 불편 부위 (3단계 선택) ══════ -->
    <div class="subpage" id="painPage">
        <div class="sub-header">
            <div class="sub-title" id="painPageTitle">불편 부위</div>
        </div>
        <div class="quad-grid" id="painGrid">
            <!-- JS로 채움 -->
        </div>
    </div>

    <!-- ══════ 확장 소통 (4분할: 추천3 + 직접 만들기) ══════ -->
    <div class="subpage" id="extendedPage">
        <div class="sub-header">
            <div class="sub-title">확장 소통</div>
        </div>
        <div class="quad-grid" id="extendedGrid">
            <!-- JS renderExtendedPage()로 채움 -->
        </div>
    </div>

    <!-- ══════ 직접 만들기 (순차 단계 빌더) ══════ -->
    <div class="subpage" id="builderPage">
        <div class="sub-header">
            <div class="sub-title" id="builderTitle">Step 1 — 누가</div>
        </div>
        <div class="quad-grid" id="builderGrid">
            <!-- JS renderBuilderStep()으로 채움 -->
        </div>
    </div>

    <!-- ══════ 커스텀 ══════ -->
    <div class="subpage" id="customPage">
        <div class="sub-header">
            <div class="sub-title">커스텀</div>
        </div>
        <div class="custom-grid">
            <div class="custom-item has-content">
                <div class="c-icon">📺</div>
                <div class="c-label">유튜브</div>
                <div class="c-desc">보호자 설정 완료</div>
            </div>
            <div class="custom-item has-content">
                <div class="c-icon">🎵</div>
                <div class="c-label">음악 재생</div>
                <div class="c-desc">보호자 설정 완료</div>
            </div>
            <div class="custom-item">
                <div class="c-icon">➕</div>
                <div class="c-label">추가하기</div>
                <div class="c-desc">보호자 앱에서 설정</div>
            </div>
            <div class="custom-item">
                <div class="c-icon">➕</div>
                <div class="c-label">추가하기</div>
                <div class="c-desc">보호자 앱에서 설정</div>
            </div>
        </div>
    </div>

    <!-- ══════ 글로벌: 더블블링크 홈 버튼 (프로토타입 테스트용) ══════ -->
    <button class="btn-blink-home" onclick="goHome()">👁️ 더블블링크 → 홈</button>

    <!-- ══════ 글로벌: 설계 근거 버튼 ══════ -->
    <button class="btn-rationale" onclick="showRationale()">📋 설계 근거</button>

    <!-- ══════ 근거 모달 ══════ -->
    <div class="rationale-overlay" id="rationaleOverlay">
        <div class="rationale-box">
            <button class="btn-close-rationale" onclick="closeRationale()">✕</button>
            <div id="rationaleContent"></div>
        </div>
    </div>

    <!-- ══════ 선택 피드백 ══════ -->
    <div class="select-feedback" id="selectFeedback"></div>

    <script>
        // ══════════════════════════════════════
        // 데이터 정의
        // ══════════════════════════════════════

        // 특화 소통 카테고리 (근거 기반 우선순위 정렬)
        const specialCategories = [
            { key: "pain",     icon: "🩺", label: "불편 부위",   css: "qi-pain" },      // 1위: PMC 임상 중요도 1위
            { key: "toilet",   icon: "🚻", label: "화장실·위생", css: "qi-toilet" },     // 2위: 긴급성 최상위
            { key: "posture",  icon: "🧑‍🦽", label: "자세/이동",   css: "qi-posture" },    // 3위: OHSU 지시전달 2위
            { key: "meal",     icon: "💧", label: "영양/수분",   css: "qi-meal" },       // 4위: PEG 튜브 환자 기본 욕구
            { key: "response", icon: "💛", label: "감정 표현",   css: "qi-response" },   // 5위: PMC 감정표현 3위
            { key: "environ",  icon: "🌡️", label: "온도/환경",   css: "qi-environ" },    // 6위: 임상 AAC Environment
            { key: "sleep",    icon: "😴", label: "수면",       css: "qi-sleep" },      // 7위: 임상 AAC Daily Care
            { key: "extended", icon: "🤖", label: "확장 소통으로", css: "qi-next" },      // 8위: AI 추천 영역 연결
        ];

        // 카테고리별 표현 목록
        // 카테고리별 표현 목록 (보호자 되물음 가능한 세부 선택지 제외)
        const expressions = {
            toilet: {
                title: "화장실·위생",
                items: ["소변이요", "대변이요", "기저귀 갈아주세요",
                        "다 했어요", "씻겨주세요", "양치하고 싶어요"]
            },
            posture: {
                title: "자세/이동",
                items: ["일으켜주세요", "눕혀주세요", "돌려주세요",
                        "베개 위치 바꿔주세요", "다리 올려주세요", "고개 돌려주세요"]
            },
            meal: {
                title: "영양/수분",
                items: ["속이 불편해요", "입이 말라요", "수분 보충해주세요",
                        "속도 줄여주세요", "배가 더부룩해요", "입 안 닦아주세요"]
            },
            response: {
                title: "감정 표현",
                items: ["괜찮아요", "힘들어요", "감사해요",
                        "미안해요", "같이 있어주세요", "사랑해요"]
            },
            environ: {
                title: "온도/환경",
                items: ["추워요", "더워요", "시끄러워요",
                        "환기해주세요", "불 켜주세요", "냄새나요"]
            },
            sleep: {
                title: "수면",
                items: ["졸려요", "잠이 안 와요", "불 꺼주세요",
                        "이불 덮어주세요", "이불 치워주세요", "숨이 답답해요"]
            },
        };

        // 직접 만들기 — 주제 → 세부 → 의도 → AI 문장 (D방식)
        const builderTopics = {
            person: {
                label: "사람",
                icon: "👤",
                details: ["엄마", "아빠", "가족", "간병인", "의사", "친구", "아이", "손님"],
                intents: ["보고 싶어요", "불러주세요", "전화해주세요", "같이 있어주세요", "언제 와요?", "고마워요"]
            },
            thing: {
                label: "물건",
                icon: "📦",
                details: ["물", "밥", "약", "TV", "전화기", "음악", "이불", "옷", "안경", "휴지", "책", "사진"],
                intents: ["주세요", "치워주세요", "가져다주세요", "틀어주세요", "꺼주세요", "바꿔주세요"]
            },
            activity: {
                label: "활동",
                icon: "🎯",
                details: ["산책", "외출", "운동", "목욕", "대화", "게임"],
                intents: ["하고 싶어요", "그만할래요", "도와주세요", "언제 해요?", "준비해주세요", "시작해주세요"]
            },
            state: {
                label: "상태",
                icon: "💭",
                details: ["피곤해요", "심심해요", "불안해요", "궁금해요", "답답해요", "기분 좋아요"],
                intents: ["알려주세요", "도와주세요", "어떡해요?", "괜찮아요", "힘들어요", "나아졌어요"]
            }
        };
        const topicKeys = ['person', 'thing', 'activity', 'state'];

        let sentenceBuilder = { topicKey: null, detail: null, intent: null };
        let builderCurrentStep = 0;  // 0=주제, 1=세부, 2=의도
        let builderSlotPageIndex = 0;

        // ══════════════════════════════════════
        // 시간 표시
        // ══════════════════════════════════════
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('headerTime').textContent = `${h}:${m}`;
        }
        updateTime();
        setInterval(updateTime, 30000);

        // ══════════════════════════════════════
        // 페이지 네비게이션
        // ══════════════════════════════════════
        function showPage(pageId) {
            document.querySelectorAll('.subpage').forEach(p => p.classList.remove('active'));
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById(pageId).classList.add('active');
        }

        function goHome() {
            document.querySelectorAll('.subpage').forEach(p => p.classList.remove('active'));
            document.getElementById('mainPage').style.display = '';
        }

        // ══════════════════════════════════════
        // 호출
        // ══════════════════════════════════════
        function triggerCall() {
            document.getElementById('callOverlay').classList.add('active');
        }

        function hideCall() {
            document.getElementById('callOverlay').classList.remove('active');
        }

        // ══════════════════════════════════════
        // 특화 소통 — 카테고리 4분할 페이지네이션
        // ══════════════════════════════════════
        let specialPageIndex = 0;
        const ITEMS_PER_PAGE = 3; // 3개 콘텐츠 + 1개 "다른 소통"

        function renderSpecialPage(pageIdx) {
            specialPageIndex = pageIdx;
            const grid = document.getElementById('specialGrid');
            grid.innerHTML = '';

            const start = pageIdx * ITEMS_PER_PAGE;
            const pageItems = specialCategories.slice(start, start + ITEMS_PER_PAGE);
            const hasMore = (start + ITEMS_PER_PAGE) < specialCategories.length;

            // 콘텐츠 아이템 (최대 3개)
            pageItems.forEach(cat => {
                const div = document.createElement('div');
                div.className = `quad-item ${cat.css}`;
                div.innerHTML = `
                    <div class="q-item-icon">${cat.icon}</div>
                    <div class="q-item-label">${cat.label}</div>
                `;
                div.onclick = () => openCategory(cat.key);
                grid.appendChild(div);
            });

            // 4번째 칸: "다른 소통" 또는 "처음으로"
            const navDiv = document.createElement('div');
            if (hasMore) {
                navDiv.className = 'quad-item qi-next';
                navDiv.innerHTML = `
                    <div class="q-item-icon">➡️</div>
                    <div class="q-item-label">다른 소통</div>
                `;
                navDiv.onclick = () => renderSpecialPage(pageIdx + 1);
            } else if (pageIdx > 0) {
                // 마지막 페이지: "처음으로" 버튼
                navDiv.className = 'quad-item qi-next';
                navDiv.innerHTML = `
                    <div class="q-item-icon">🔄</div>
                    <div class="q-item-label">처음으로</div>
                `;
                navDiv.onclick = () => renderSpecialPage(0);
            }

            // 아이템이 3개 미만이어도 4번째 칸 채우기
            if (hasMore || pageIdx > 0) {
                grid.appendChild(navDiv);
            }

            // 빈 칸 채우기 (페이지 아이템이 3개 미만 + 네비 없을 때)
            const totalSlots = grid.children.length;
            for (let i = totalSlots; i < 4; i++) {
                const empty = document.createElement('div');
                empty.className = 'quad-item';
                empty.style.visibility = 'hidden';
                grid.appendChild(empty);
            }

            showPage('specialPage');
        }

        function openCategory(key) {
            if (key === 'pain') {
                renderPainStep1();
                return;
            }
            if (key === 'extended') {
                renderExtendedPage();
                return;
            }
            renderExprPage(key, 0);
        }

        // ══════════════════════════════════════
        // 확장 소통 — 4분할 (추천3 + 직접 만들기)
        // ══════════════════════════════════════
        function getRecommendations() {
            const h = new Date().getHours();
            if (h >= 6 && h < 11)  return ["약 먹을 시간이에요", "오늘 컨디션 괜찮아요", "창문 열어주세요"];
            if (h >= 11 && h < 17) return ["TV 틀어주세요", "물 마시고 싶어요", "전화하고 싶어요"];
            if (h >= 17 && h < 22) return ["가족 보고 싶어요", "음악 틀어주세요", "오늘 고마웠어요"];
            return ["잠이 안 와요", "불 꺼주세요", "숨이 답답해요"];
        }

        function renderExtendedPage() {
            const grid = document.getElementById('extendedGrid');
            grid.innerHTML = '';

            const recs = getRecommendations();
            recs.forEach((rec, i) => {
                const div = document.createElement('div');
                div.className = 'quad-item qi-builder-rec';
                div.innerHTML = `
                    <div class="q-item-icon">추천${i + 1}</div>
                    <div class="q-item-label">${rec}</div>
                `;
                div.onclick = () => selectExpr(rec);
                grid.appendChild(div);
            });

            const builderDiv = document.createElement('div');
            builderDiv.className = 'quad-item qi-builder';
            builderDiv.innerHTML = `
                <div class="q-item-icon">✏️</div>
                <div class="q-item-label">직접 만들기</div>
            `;
            builderDiv.onclick = () => openBuilder();
            grid.appendChild(builderDiv);

            showPage('extendedPage');
        }

        // ══════════════════════════════════════
        // 직접 만들기 — 주제 → 세부 → 의도 → AI 문장
        // ══════════════════════════════════════
        function openBuilder() {
            sentenceBuilder = { topicKey: null, detail: null, intent: null };
            builderCurrentStep = 0;
            builderSlotPageIndex = 0;
            renderBuilderStep();
        }

        function renderBuilderStep() {
            const grid = document.getElementById('builderGrid');
            grid.innerHTML = '';

            // Step 0: 주제 선택 (4개 → pagination 불필요)
            if (builderCurrentStep === 0) {
                document.getElementById('builderTitle').textContent = 'Step 1 — 주제';
                topicKeys.forEach(key => {
                    const topic = builderTopics[key];
                    const div = document.createElement('div');
                    div.className = 'quad-item qi-builder-topic';
                    div.innerHTML = `
                        <div class="q-item-icon">${topic.icon}</div>
                        <div class="q-item-label">${topic.label}</div>
                    `;
                    div.onclick = () => {
                        sentenceBuilder.topicKey = key;
                        builderCurrentStep = 1;
                        builderSlotPageIndex = 0;
                        renderBuilderStep();
                    };
                    grid.appendChild(div);
                });
                showPage('builderPage');
                return;
            }

            // Step 1, 2: 세부/의도 선택 (3+1 pagination)
            const topic = builderTopics[sentenceBuilder.topicKey];
            const isDetail = (builderCurrentStep === 1);
            const items = isDetail ? topic.details : topic.intents;
            const stepLabel = isDetail ? '세부' : '의도';

            document.getElementById('builderTitle').textContent =
                `Step ${builderCurrentStep + 1} — ${stepLabel}`;

            const start = builderSlotPageIndex * ITEMS_PER_PAGE;
            const pageItems = items.slice(start, start + ITEMS_PER_PAGE);
            const hasMore = (start + ITEMS_PER_PAGE) < items.length;

            pageItems.forEach(text => {
                const div = document.createElement('div');
                div.className = 'quad-expr';
                div.textContent = text;
                div.onclick = () => {
                    if (isDetail) {
                        sentenceBuilder.detail = text;
                        builderCurrentStep = 2;
                    } else {
                        sentenceBuilder.intent = text;
                    }
                    builderSlotPageIndex = 0;
                    if (builderCurrentStep <= 2 && !sentenceBuilder.intent) {
                        renderBuilderStep();
                    } else {
                        renderBuilderResult();
                    }
                };
                grid.appendChild(div);
            });

            if (hasMore) {
                const nav = document.createElement('div');
                nav.className = 'quad-expr-next';
                nav.innerHTML = `<div class="next-icon">➡️</div>다른 선택지`;
                nav.onclick = () => { builderSlotPageIndex++; renderBuilderStep(); };
                grid.appendChild(nav);
            } else if (builderSlotPageIndex > 0) {
                const nav = document.createElement('div');
                nav.className = 'quad-expr-next';
                nav.innerHTML = `<div class="next-icon">🔄</div>처음으로`;
                nav.onclick = () => { builderSlotPageIndex = 0; renderBuilderStep(); };
                grid.appendChild(nav);
            }

            // 빈 칸 채우기
            const total = grid.children.length;
            for (let i = total; i < 4; i++) {
                const empty = document.createElement('div');
                empty.className = 'quad-item';
                empty.style.visibility = 'hidden';
                grid.appendChild(empty);
            }

            showPage('builderPage');
        }

        function generateSentenceCandidates(topicKey, detail, intent) {
            // 프로토타입: 템플릿 기반. 실서비스: LLM API가 자연스러운 문장 생성
            const c1 = `${detail} ${intent}`;

            if (topicKey === 'person') {
                return [c1, `${detail}한테 연락해주세요`, `${detail} 보고 싶어요`];
            }
            if (topicKey === 'thing') {
                return [c1, `${detail} 좀 ${intent}`, `${detail} 부탁해요`];
            }
            if (topicKey === 'activity') {
                return [c1, `${detail} 좀 ${intent}`, `${detail} 하고 싶어요`];
            }
            // state
            return [c1, `지금 ${detail}`, `${detail}, ${intent}`];
        }

        function renderBuilderResult() {
            const grid = document.getElementById('builderGrid');
            grid.innerHTML = '';
            document.getElementById('builderTitle').textContent = 'AI 완성 문장';

            const candidates = generateSentenceCandidates(
                sentenceBuilder.topicKey,
                sentenceBuilder.detail,
                sentenceBuilder.intent
            );

            candidates.forEach(sentence => {
                const div = document.createElement('div');
                div.className = 'quad-item qi-builder-result';
                div.innerHTML = `<div class="q-item-label">${sentence}</div>`;
                div.onclick = () => selectExpr(sentence);
                grid.appendChild(div);
            });

            const resetDiv = document.createElement('div');
            resetDiv.className = 'quad-item qi-builder-reset';
            resetDiv.innerHTML = `
                <div class="q-item-icon">🔄</div>
                <div class="q-item-label">다시 만들기</div>
            `;
            resetDiv.onclick = () => openBuilder();
            grid.appendChild(resetDiv);

            showPage('builderPage');
        }

        // ══════════════════════════════════════
        // 불편 부위 — 3단계 선택
        // ══════════════════════════════════════
        const painAreas = {
            "머리/목":   ["머리(앞)", "머리(뒤)", "목", "얼굴"],
            "가슴/배":   ["가슴", "윗배", "아랫배", "옆구리"],
            "팔/어깨":   ["어깨", "윗팔", "팔꿈치/아래팔", "손/손목"],
            "허리/다리": ["허리", "엉덩이/골반", "무릎/허벅지", "발/종아리"],
        };

        const painLevels = ["많이 아파요", "조금 아파요", "따끔/저림", "간지러워요"];

        let painSelectedArea = "";
        let painSelectedDetail = "";

        function renderPainStep1() {
            document.getElementById('painPageTitle').textContent = '불편 부위 — 어디가 불편한가요?';
            const grid = document.getElementById('painGrid');
            grid.innerHTML = '';

            const areas = Object.keys(painAreas);
            areas.forEach(area => {
                const div = document.createElement('div');
                div.className = 'quad-item qi-pain-area';
                div.innerHTML = `
                    <div class="q-item-icon">${getAreaIcon(area)}</div>
                    <div class="q-item-label">${area}</div>
                `;
                div.onclick = () => {
                    painSelectedArea = area;
                    renderPainStep2(area);
                };
                grid.appendChild(div);
            });

            showPage('painPage');
        }

        function renderPainStep2(area) {
            document.getElementById('painPageTitle').textContent = `불편 부위 — ${area} 어디?`;
            const grid = document.getElementById('painGrid');
            grid.innerHTML = '';

            const details = painAreas[area];
            details.forEach(detail => {
                const div = document.createElement('div');
                div.className = 'quad-item qi-pain-area';
                div.innerHTML = `
                    <div class="q-item-icon">📍</div>
                    <div class="q-item-label">${detail}</div>
                `;
                div.onclick = () => {
                    painSelectedDetail = detail;
                    renderPainStep3(detail);
                };
                grid.appendChild(div);
            });

            showPage('painPage');
        }

        function renderPainStep3(detail) {
            document.getElementById('painPageTitle').textContent = `불편 부위 — ${detail} 어떻게?`;
            const grid = document.getElementById('painGrid');
            grid.innerHTML = '';

            const icons = ["😣", "😕", "⚡", "🤏"];
            painLevels.forEach((level, i) => {
                const div = document.createElement('div');
                div.className = 'quad-item qi-pain-level';
                div.innerHTML = `
                    <div class="q-item-icon">${icons[i]}</div>
                    <div class="q-item-label">${level}</div>
                `;
                div.onclick = () => {
                    selectExpr(`${painSelectedDetail} — ${level}`);
                };
                grid.appendChild(div);
            });

            showPage('painPage');
        }

        function getAreaIcon(area) {
            const map = { "머리/목": "🧠", "가슴/배": "🫁", "팔/어깨": "💪", "허리/다리": "🦵" };
            return map[area] || "🩺";
        }

        // ══════════════════════════════════════
        // 표현 목록 — 4분할 페이지네이션
        // ══════════════════════════════════════
        let currentExprCategory = null;
        let exprPageIndex = 0;

        function renderExprPage(categoryKey, pageIdx) {
            currentExprCategory = categoryKey;
            exprPageIndex = pageIdx;

            const data = expressions[categoryKey];
            if (!data) return;

            document.getElementById('exprPageTitle').textContent = data.title;
            const grid = document.getElementById('exprGrid');
            grid.innerHTML = '';

            const items = data.items;
            const start = pageIdx * ITEMS_PER_PAGE;
            const pageItems = items.slice(start, start + ITEMS_PER_PAGE);
            const hasMore = (start + ITEMS_PER_PAGE) < items.length;

            // 표현 버튼 (최대 3개)
            pageItems.forEach(text => {
                const div = document.createElement('div');
                div.className = 'quad-expr';
                div.textContent = text;
                div.onclick = () => selectExpr(text);
                grid.appendChild(div);
            });

            // 4번째 칸: "다른 표현" 또는 "처음으로"
            const navDiv = document.createElement('div');
            if (hasMore) {
                navDiv.className = 'quad-expr-next';
                navDiv.innerHTML = `
                    <div class="next-icon">➡️</div>
                    다른 표현
                `;
                navDiv.onclick = () => renderExprPage(categoryKey, pageIdx + 1);
            } else if (pageIdx > 0) {
                navDiv.className = 'quad-expr-next';
                navDiv.innerHTML = `
                    <div class="next-icon">🔄</div>
                    처음으로
                `;
                navDiv.onclick = () => renderExprPage(categoryKey, 0);
            }

            if (hasMore || pageIdx > 0) {
                grid.appendChild(navDiv);
            }

            // 빈 칸 채우기
            const totalSlots = grid.children.length;
            for (let i = totalSlots; i < 4; i++) {
                const empty = document.createElement('div');
                empty.className = 'quad-expr';
                empty.style.visibility = 'hidden';
                grid.appendChild(empty);
            }

            showPage('exprPage');
        }

        // ══════════════════════════════════════
        // 특화 소통 진입점 (메인에서 호출)
        // ══════════════════════════════════════
        function enterSpecial() {
            renderSpecialPage(0);
        }

        // ══════════════════════════════════════
        // 표현 선택 피드백
        // ══════════════════════════════════════
        function selectExpr(text) {
            const fb = document.getElementById('selectFeedback');
            fb.textContent = `✓ "${text}"`;
            fb.style.display = 'block';
            setTimeout(() => {
