<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이모지로 말해요</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap');

  :root {
    --bg: #0d0d14;
    --surface: #16161f;
    --card: #1e1e2e;
    --border: #2a2a3e;
    --accent: #7c6af7;
    --accent2: #f7a06a;
    --accent3: #6af7c0;
    --text: #e8e8f0;
    --muted: #888899;
    --selected-bg: rgba(124,106,247,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Gowun Dodum', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(13,13,20,0.85);
    backdrop-filter: blur(12px);
  }

  .logo-dot {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 18px rgba(124,106,247,0.5);
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  header p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  .main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 1fr;
    gap: 0;
    height: calc(100vh - 73px);
  }

  /* LEFT PANEL */
  .left-panel {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .section-title {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    padding: 16px 18px 10px;
    border-bottom: 1px solid var(--border);
  }

  /* Category tabs */
  .cat-tabs {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 10px 10px;
    overflow-y: auto;
  }

  .cat-tab {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s;
    font-size: 14px;
    color: var(--muted);
    border: 1px solid transparent;
    user-select: none;
  }

  .cat-tab:hover {
    background: var(--card);
    color: var(--text);
  }

  .cat-tab.active {
    background: var(--selected-bg);
    border-color: var(--accent);
    color: var(--text);
  }

  .cat-tab .cat-icon { font-size: 20px; }
  .cat-tab .cat-name { font-size: 13px; }

  /* Emoji grid */
  .emoji-grid-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    border-top: 1px solid var(--border);
  }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .emoji-btn {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    border-radius: 10px;
    cursor: pointer;
    background: var(--card);
    border: 1px solid var(--border);
    transition: all 0.15s;
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  .emoji-btn:hover {
    transform: scale(1.12);
    border-color: var(--accent);
    background: var(--selected-bg);
    z-index: 2;
  }

  .emoji-btn:active {
    transform: scale(0.96);
  }

  /* RIGHT PANEL */
  .right-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Compose area */
  .compose-area {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .compose-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .emoji-sequence {
    min-height: 54px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    position: relative;
  }

  .emoji-sequence .placeholder {
    color: var(--muted);
    font-size: 14px;
    position: absolute;
    left: 14px;
  }

  .seq-emoji {
    font-size: 28px;
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
  }

  .seq-emoji:hover::after {
    content: '×';
    position: absolute;
    top: -6px; right: -6px;
    font-size: 11px;
    background: #e05;
    color: white;
    border-radius: 50%;
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    font-family: sans-serif;
  }

  /* Punctuation selector */
  .punct-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .punct-label {
    font-size: 12px;
    color: var(--muted);
    margin-right: 4px;
  }

  .punct-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Gowun Dodum', sans-serif;
    user-select: none;
  }

  .punct-btn:hover, .punct-btn.active {
    background: var(--selected-bg);
    border-color: var(--accent);
    color: var(--accent);
  }

  .interpret-btn {
    margin-left: auto;
    padding: 8px 20px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Gowun Dodum', sans-serif;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 14px rgba(124,106,247,0.35);
  }

  .interpret-btn:hover {
    background: #9580ff;
    box-shadow: 0 0 22px rgba(124,106,247,0.6);
    transform: translateY(-1px);
  }

  .interpret-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .clear-btn {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    font-family: 'Gowun Dodum', sans-serif;
    transition: all 0.15s;
  }

  .clear-btn:hover {
    border-color: #e05;
    color: #e05;
  }

  /* Results area */
  .results-area {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
  }

  .results-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* Suggestion cards */
  .suggestion-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: slideUp 0.3s ease both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .suggestion-card:nth-child(2) { animation-delay: 0.06s; }
  .suggestion-card:nth-child(3) { animation-delay: 0.12s; }
  .suggestion-card:nth-child(4) { animation-delay: 0.18s; }
  .suggestion-card:nth-child(5) { animation-delay: 0.24s; }

  .suggestion-card:hover {
    border-color: var(--accent);
    background: var(--selected-bg);
    transform: translateX(4px);
  }

  .suggestion-card .s-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .suggestion-card:hover .s-num {
    background: var(--accent);
    color: white;
  }

  .suggestion-card .s-text {
    font-size: 17px;
    color: var(--text);
    flex: 1;
  }

  .suggestion-card .s-use {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    flex-shrink: 0;
  }

  .suggestion-card:hover .s-use {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Output bubble */
  .output-bubble {
    background: linear-gradient(135deg, rgba(124,106,247,0.15), rgba(106,247,192,0.08));
    border: 1px solid var(--accent);
    border-radius: 18px;
    padding: 18px 22px;
    margin-bottom: 18px;
    animation: slideUp 0.3s ease both;
  }

  .output-bubble .ob-label {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .output-bubble .ob-text {
    font-size: 22px;
    color: var(--text);
    line-height: 1.5;
  }

  .output-bubble .ob-emoji-row {
    margin-top: 8px;
    font-size: 22px;
  }

  /* Loading dots */
  .loading {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 16px 0;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-6px); opacity: 1; }
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Quick-pick recent */
  .recent-row {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .recent-emoji {
    font-size: 22px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    transition: all 0.15s;
    border: 1px solid transparent;
  }

  .recent-emoji:hover {
    background: var(--card);
    border-color: var(--border);
    transform: scale(1.15);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
  }

  .empty-state .big-emoji { font-size: 48px; margin-bottom: 14px; }

  /* Ripple */
  @keyframes ripple {
    from { transform: scale(0); opacity: 0.5; }
    to { transform: scale(3); opacity: 0; }
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo-dot">💬</div>
  <div>
    <h1>이모지로 말해요</h1>
    <p>이모지를 골라 문장을 만들어요</p>
  </div>
</header>

<div class="main">
  <!-- LEFT: Category + Emoji Grid -->
  <div class="left-panel">
    <div class="section-title">카테고리</div>
    <div class="cat-tabs" id="catTabs"></div>

    <div class="section-title" style="margin-top:0;">자주 쓴 이모지</div>
    <div class="recent-row" id="recentRow">
      <span class="empty-state" style="padding:8px 12px;font-size:12px;">아직 없어요</span>
    </div>

    <div class="emoji-grid-wrap">
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>
  </div>

  <!-- RIGHT: Compose + Results -->
  <div class="right-panel">
    <div class="compose-area">
      <div class="compose-label">선택한 이모지</div>
      <div class="emoji-sequence" id="emojiSequence">
        <span class="placeholder" id="seqPlaceholder">← 왼쪽에서 이모지를 골라보세요</span>
      </div>
      <div class="punct-row">
        <span class="punct-label">마침:</span>
        <button class="punct-btn active" data-p=".">마침표 .</button>
        <button class="punct-btn" data-p="!">느낌표 !</button>
        <button class="punct-btn" data-p="?">물음표 ?</button>
        <button class="punct-btn" data-p="">없음</button>
        <button class="clear-btn" id="clearBtn">지우기</button>
        <button class="interpret-btn" id="interpretBtn" disabled>
          <span id="btnText">✨ 해석하기</span>
        </button>
      </div>
    </div>

    <div class="results-area" id="resultsArea">
      <div class="empty-state">
        <div class="big-emoji">🌟</div>
        이모지를 골라 <strong>해석하기</strong>를 누르면<br>
        AI가 문장으로 바꿔드려요
      </div>
    </div>
  </div>
</div>

<script>
const CATEGORIES = [
  { id: 'face', icon: '😊', name: '표정 · 사람', emojis: ['😀','😊','🥰','😂','😭','😅','😍','🥺','😤','😴','🤔','😎','🥳','😢','😡','🤗','😶','🙂','😬','🫡','🫶','👋','🤝','👍','👎','🙏','💪','🤲','✌️','🫂','🧑','👩','👨','🧒','👴','👵','🧑‍⚕️','🧑‍🍳','🧑‍🏫','💆'] },
  { id: 'nature', icon: '🌿', name: '동물 · 자연', emojis: ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐸','🐙','🦋','🌸','🌺','🍀','🌈','⭐','🌙','☀️','🌊','🌸','🌻','🍃','🌲','🌵','🦴','🐠','🐝','🦜','🐚','🌾','🍄','🌍'] },
  { id: 'food', icon: '🍔', name: '음식 · 음료', emojis: ['🍎','🍊','🍋','🍇','🍓','🍑','🍕','🍔','🍟','🌮','🍜','🍣','🍦','🎂','🍰','🧁','🍩','🥤','☕','🍵','🧃','🍺','🥛','🧋','🍱','🥗','🍳','🥚','🍞','🥐','🧀','🥩','🍗','🍤','🥡'] },
  { id: 'activity', icon: '⚽', name: '활동 · 스포츠', emojis: ['🏃','🚶','🧘','💤','🎮','📖','🎵','🎨','🏋️','🚴','🏊','⚽','🏀','🎸','🎯','🧩','✈️','🛁','💊','🏥','📱','💻','⌨️','📺','🎬','🎪','🎠','🎡','🎢','🧸','🪆','🎭','🎤','🥁','🎺','🎻'] },
  { id: 'place', icon: '🏠', name: '여행 · 장소', emojis: ['🏠','🏥','🏫','🏪','🌆','🏞','🗼','🗽','⛩','🛕','🏰','🗺','🚗','🚌','🚂','✈️','🚢','🛸','🏖','🏕','🌃','🎆','🎇','🌉','🗿','🏔','🌋','🏜','🏝','🌁','🏟','🏗','🏭','🌐','🧭'] },
  { id: 'emotion', icon: '❤️', name: '감정 · 기호', emojis: ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','💕','💞','💫','⚡','🔥','✨','💢','💥','🌀','💤','❓','❕','🆘','✅','❌','⭕','🔔','🎉','🎊','🎁','🏆','🥇','🌟','💯','🆗','💡','🔑'] },
];

let selectedEmojis = [];
let selectedPunct = '.';
let recentEmojis = [];
let currentCat = 0;

// Render categories
const catTabs = document.getElementById('catTabs');
CATEGORIES.forEach((cat, i) => {
  const tab = document.createElement('div');
  tab.className = 'cat-tab' + (i === 0 ? ' active' : '');
  tab.innerHTML = `<span class="cat-icon">${cat.icon}</span><span class="cat-name">${cat.name}</span>`;
  tab.onclick = () => {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = i;
    renderGrid(i);
  };
  catTabs.appendChild(tab);
});

function renderGrid(idx) {
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = '';
  CATEGORIES[idx].emojis.forEach(em => {
    const btn = document.createElement('div');
    btn.className = 'emoji-btn';
    btn.textContent = em;
    btn.title = em;
    btn.onclick = () => addEmoji(em);
    grid.appendChild(btn);
  });
}

renderGrid(0);

function addEmoji(em) {
  selectedEmojis.push(em);
  updateRecent(em);
  renderSequence();
  document.getElementById('interpretBtn').disabled = false;
}

function updateRecent(em) {
  recentEmojis = [em, ...recentEmojis.filter(e => e !== em)].slice(0, 12);
  renderRecent();
}

function renderRecent() {
  const row = document.getElementById('recentRow');
  if (recentEmojis.length === 0) {
    row.innerHTML = '<span style="padding:8px 12px;font-size:12px;color:var(--muted)">아직 없어요</span>';
    return;
  }
  row.innerHTML = recentEmojis.map(em =>
    `<span class="recent-emoji" onclick="addEmoji('${em}')" title="${em}">${em}</span>`
  ).join('');
}

function renderSequence() {
  const seq = document.getElementById('emojiSequence');
  const ph = document.getElementById('seqPlaceholder');
  if (selectedEmojis.length === 0) {
    seq.innerHTML = '<span class="placeholder" id="seqPlaceholder">← 왼쪽에서 이모지를 골라보세요</span>';
    return;
  }
  ph && (ph.style.display = 'none');
  seq.innerHTML = selectedEmojis.map((em, i) =>
    `<span class="seq-emoji" title="클릭하면 제거" onclick="removeEmoji(${i})">${em}</span>`
  ).join('');
}

function removeEmoji(idx) {
  selectedEmojis.splice(idx, 1);
  renderSequence();
  document.getElementById('interpretBtn').disabled = selectedEmojis.length === 0;
}

// Punctuation
document.querySelectorAll('.punct-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.punct-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedPunct = btn.dataset.p;
  };
});

// Clear
document.getElementById('clearBtn').onclick = () => {
  selectedEmojis = [];
  renderSequence();
  document.getElementById('interpretBtn').disabled = true;
  document.getElementById('resultsArea').innerHTML = `
    <div class="empty-state">
      <div class="big-emoji">🌟</div>
      이모지를 골라 <strong>해석하기</strong>를 누르면<br>
      AI가 문장으로 바꿔드려요
    </div>`;
};

// Interpret
document.getElementById('interpretBtn').onclick = async () => {
  const btn = document.getElementById('interpretBtn');
  const btnText = document.getElementById('btnText');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span>';

  const emojiStr = selectedEmojis.join(' ');
  const punctName = selectedPunct === '.' ? '마침표(평서문)' : selectedPunct === '!' ? '느낌표(감탄문)' : selectedPunct === '?' ? '물음표(의문문)' : '없음';

  const resultsArea = document.getElementById('resultsArea');
  resultsArea.innerHTML = '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

  const prompt = `당신은 루게릭병 환자가 이모지로 전달한 의사소통을 도와주는 AI입니다.
  
사용자가 선택한 이모지: ${emojiStr}
문장 종결 방식: ${punctName}

이 이모지 조합을 자연스러운 한국어 문장으로 해석해주세요.
규칙:
1. 정확히 5개의 서로 다른 문장 후보를 제시하세요
2. 문장 끝은 반드시 "${selectedPunct || ''}"로 끝나야 합니다 (없음이면 자유)
3. 다양한 의미로 해석하세요 (욕구, 감정, 상태, 질문 등)
4. 짧고 명확한 문장으로 (10~20자)
5. JSON 배열만 반환하세요: ["문장1", "문장2", "문장3", "문장4", "문장5"]`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    const raw = data.content.map(c => c.text || '').join('');
    let suggestions = [];
    try {
      const match = raw.match(/\[[\s\S]*\]/);
      if (match) suggestions = JSON.parse(match[0]);
    } catch { suggestions = []; }

    if (!suggestions.length) throw new Error('parse fail');

    resultsArea.innerHTML = `
      <div class="output-bubble">
        <div class="ob-label">✨ 이모지 조합</div>
        <div class="ob-emoji-row">${emojiStr} ${selectedPunct}</div>
      </div>
      <div class="results-label">문장 후보 — 원하는 문장을 선택하세요</div>
      ${suggestions.map((s, i) => `
        <div class="suggestion-card" onclick="selectSentence('${s.replace(/'/g,"\\'")}')">
          <div class="s-num">${i + 1}</div>
          <div class="s-text">${s}</div>
          <div class="s-use">선택</div>
        </div>
      `).join('')}
    `;
  } catch (e) {
    resultsArea.innerHTML = `<div class="empty-state" style="color:#f77">오류가 발생했어요. 다시 시도해주세요.</div>`;
  }

  btn.disabled = false;
  btnText.innerHTML = '✨ 해석하기';
};

function selectSentence(text) {
  const resultsArea = document.getElementById('resultsArea');
  const existing = document.getElementById('selectedOutput');
  if (existing) existing.remove();

  const div = document.createElement('div');
  div.id = 'selectedOutput';
  div.style.cssText = 'background:linear-gradient(135deg,rgba(106,247,192,0.12),rgba(124,106,247,0.1));border:1px solid var(--accent3);border-radius:14px;padding:18px 22px;margin-bottom:16px;animation:slideUp 0.3s ease both';
  div.innerHTML = `
    <div style="font-size:11px;color:var(--accent3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">✅ 선택된 문장</div>
    <div style="font-size:24px;color:var(--text)">${text}</div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button onclick="copyText('${text.replace(/'/g,"\\'")}')" style="padding:6px 14px;border-radius:20px;border:1px solid var(--accent3);background:transparent;color:var(--accent3);font-size:13px;cursor:pointer;font-family:'Gowun Dodum',sans-serif">📋 복사</button>
      <button onclick="speakText('${text.replace(/'/g,"\\'")}')" style="padding:6px 14px;border-radius:20px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;cursor:pointer;font-family:'Gowun Dodum',sans-serif">🔊 읽어주기</button>
    </div>
  `;
  resultsArea.insertBefore(div, resultsArea.firstChild);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => alert('복사됐어요!'));
}

function speakText(text) {
  if ('speechSynthesis' in window) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    speechSynthesis.speak(utter);
  }
}
</script>
