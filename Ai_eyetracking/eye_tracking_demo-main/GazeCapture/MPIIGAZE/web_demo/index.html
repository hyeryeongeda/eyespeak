<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eye Detection Demo — YOLOv8n MPIIGaze</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>👁️ Eye Detection Demo</h1>
      <p class="subtitle">YOLOv8n · MPIIGaze · ONNX Runtime Web</p>
    </header>

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">모델</span>
        <span class="stat-value" id="model-status">로딩 중...</span>
      </div>
      <div class="stat">
        <span class="stat-label">추론 시간</span>
        <span class="stat-value"><span id="infer-time">—</span> ms</span>
      </div>
      <div class="stat">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="fps-val">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Confidence</span>
        <span class="stat-value">
          <input type="range" id="conf-slider" min="0.1" max="0.95" step="0.05" value="0.45" />
          <span id="conf-val">0.45</span>
        </span>
      </div>
    </div>

    <!-- Video area -->
    <div class="video-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="btn-start" class="btn btn-primary">웹캠 시작</button>
      <button id="btn-stop" class="btn btn-danger" disabled>중지</button>
      <button id="btn-screenshot" class="btn btn-secondary" disabled>스크린샷</button>
      <a href="eye_mouse.html" class="btn btn-secondary" style="text-decoration:none;background:#1f6feb;color:#fff;">🖱️ 시선 마우스 데모</a>
      <a href="demo_6_to_9_split.html" class="btn btn-secondary" style="text-decoration:none;background:#238636;color:#fff;">6~9분할 데모</a>
    </div>

    <!-- Detection log -->
    <div class="log-panel">
      <h3>검출 결과 <span id="detect-count"></span></h3>
      <table id="result-table">
        <thead>
          <tr>
            <th>클래스</th>
            <th>Confidence</th>
            <th>x1, y1</th>
            <th>x2, y2</th>
            <th>크기(px)</th>
          </tr>
        </thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>

    <!-- Accuracy summary -->
    <div class="summary-panel">
      <h3>누적 통계</h3>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-num" id="total-frames">0</div>
          <div class="summary-label">총 프레임</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="detect-frames">0</div>
          <div class="summary-label">검출 성공</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="detect-rate">0%</div>
          <div class="summary-label">검출률</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="avg-conf">—</div>
          <div class="summary-label">평균 Confidence</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="avg-infer">—</div>
          <div class="summary-label">평균 추론(ms)</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="both-eyes-rate">0%</div>
          <div class="summary-label">양안 동시 검출</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ONNX Runtime Web (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
