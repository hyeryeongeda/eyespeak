<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6~9분할 시선 선택 데모 — 캘리브레이션</title>
  <style>
    :root { --bg:#1a1a2e; --fg:#eee; --panel:#16213e; --line:#0f3460; --hot:#00d9ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; }

    #stage {
      position: fixed; inset: 0;
      display: grid;
      gap: 12px;
      padding: 80px 24px 24px;
      align-items: stretch;
      justify-items: stretch;
    }
    #stage.split6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
    #stage.split9 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }

    .tile {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(14px, 2vw, 22px);
      font-weight: 700;
      user-select: none;
      text-align: center;
      padding: 12px;
    }
    .tile.hot {
      border-color: var(--hot);
      box-shadow: 0 0 20px rgba(0,217,255,0.3);
    }

    /* 9분할일 때 가운데 = 휴식(카메라) */
    #stage.split9 .tile.rest {
      background: rgba(15,52,96,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage.split9 .tile.rest .cam-wrap {
      width: min(200px, 20vw);
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      border: 2px solid var(--line);
    }
    #stage.split9 .tile.rest video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }
    #hud label { margin-right: 8px; }
    #hud select { padding: 6px 10px; border-radius: 6px; background: var(--panel); color: var(--fg); }
    #status { font-size: 13px; color: #8b949e; }

    #calib {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #calib.show { display: flex; }
    #calibDot {
      position: fixed;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: #00d9ff;
      box-shadow: 0 0 30px #00d9ff;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    #calibText { margin-top: 24px; font-size: 16px; text-align: center; max-width: 360px; }

    #startOverlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }
    #startCard {
      background: var(--panel);
      padding: 32px;
      border-radius: 16px;
      max-width: 420px;
      text-align: center;
    }
    #startCard h1 { margin-bottom: 16px; font-size: 22px; }
    #startCard p { margin-bottom: 20px; line-height: 1.5; color: #b0b0b0; }
    #startCard button {
      padding: 12px 28px;
      font-size: 16px;
      background: var(--hot);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    #startCard button:hover { opacity: 0.9; }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: var(--hot);
      color: #000;
      border-radius: 8px;
      font-weight: 600;
      display: none;
      z-index: 150;
    }
    #toast.show { display: block; animation: fade 2s ease-out; }
    @keyframes fade { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="startOverlay">
    <div id="startCard">
      <h1>6~9분할 시선 선택 데모</h1>
      <p>시작하면 카메라가 켜집니다. <b>6분할</b> 또는 <b>9분할</b>을 선택한 뒤, <b>캘리브레이션</b>을 진행하세요. 시선을 타일에 고정하면 선택됩니다.</p>
      <button id="startBtn">시작</button>
    </div>
  </div>

  <div id="hud">
    <div>
      <label>분할</label>
      <select id="splitSelect">
        <option value="6">6분할 (3×2)</option>
        <option value="9">9분할 (3×3)</option>
      </select>
      <button id="btnCalib" style="margin-left:12px;padding:6px 12px;border-radius:6px;cursor:pointer;background:var(--hot);color:#000;border:none;font-weight:600;">캘리브레이션</button>
    </div>
    <span id="status">카메라 시작 후 캘리브레이션을 진행하세요</span>
  </div>

  <div id="stage" class="split6">
    <!-- 6분할: 6 tiles -->
    <div class="tile" data-idx="0">영역 1</div>
    <div class="tile" data-idx="1">영역 2</div>
    <div class="tile" data-idx="2">영역 3</div>
    <div class="tile" data-idx="3">영역 4</div>
    <div class="tile" data-idx="4">영역 5</div>
    <div class="tile" data-idx="5">영역 6</div>
    <!-- 9분할용 추가 타일 (숨김) -->
    <div class="tile" data-idx="6" style="display:none;">7</div>
    <div class="tile" data-idx="7" style="display:none;">8</div>
    <div class="tile rest" data-idx="8" style="display:none;"><div class="cam-wrap"><video id="video" autoplay playsinline muted></video></div></div>
  </div>

  <div id="calib">
    <div id="calibDot"></div>
    <div id="calibText">캘리브레이션: 9개 점을 순서대로 바라보세요 (점당 약 2초)</div>
  </div>

  <div id="toast"></div>

  <script src="calibration_6_to_9.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script>
(function() {
  const stage = document.getElementById('stage');
  const splitSelect = document.getElementById('splitSelect');
  const btnCalib = document.getElementById('btnCalib');
  const statusEl = document.getElementById('status');
  const calib = document.getElementById('calib');
  const calibDot = document.getElementById('calibDot');
  const calibText = document.getElementById('calibText');
  const video = document.getElementById('video');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  const CALIB_N = 9;
  const CALIB_COLLECT_MS = 2000;
  const DWELL_MS = 800;
  const INERTIA_HOLD_MS = 260;

  let splitMode = 6;
  let tiles = [];
  let coef = null;
  let inertiaState = { lastIdx: -1, candidateIdx: -1, candidateSince: 0 };
  let hotIdx = -1, hotSince = 0, dwellArmed = false, dwellStart = 0;
  let cam = null;

  const L_IRIS = [468, 469, 470, 471, 472];
  const R_IRIS = [473, 474, 475, 476, 477];
  const L_CORNER_A = 33, L_CORNER_B = 133, L_TOP = 159, L_BOT = 145;
  const R_CORNER_A = 362, R_CORNER_B = 263, R_TOP = 386, R_BOT = 374;

  function meanPoint(lm, idxs) {
    let x = 0, y = 0;
    for (const i of idxs) { x += lm[i].x; y += lm[i].y; }
    return { x: x / idxs.length, y: y / idxs.length };
  }
  function normInEyeBox(lm, irisIdxs, cA, cB, topI, botI) {
    const iris = meanPoint(lm, irisIdxs);
    const a = lm[cA], b = lm[cB], t = lm[topI], bo = lm[botI];
    const xMin = Math.min(a.x, b.x), xMax = Math.max(a.x, b.x);
    const yMin = Math.min(t.y, bo.y), yMax = Math.max(t.y, bo.y);
    const w = Math.max(1e-6, xMax - xMin), h = Math.max(1e-6, yMax - yMin);
    const nx = (iris.x - xMin) / w, ny = (iris.y - yMin) / h;
    return { nx: Math.max(-0.5, Math.min(1.5, nx)), ny: Math.max(-0.5, Math.min(1.5, ny)) };
  }
  function getGazeNorm(lm) {
    const L = normInEyeBox(lm, L_IRIS, L_CORNER_A, L_CORNER_B, L_TOP, L_BOT);
    const R = normInEyeBox(lm, R_IRIS, R_CORNER_A, R_CORNER_B, R_TOP, R_BOT);
    return { xNorm: (L.nx + R.nx) / 2, yNorm: (L.ny + R.ny) / 2 };
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  function buildTiles() {
    tiles = Array.from(stage.querySelectorAll('.tile'));
    if (splitMode === 6) {
      stage.className = 'split6';
      tiles.forEach(function(t, i) {
        t.style.display = i < 6 ? 'flex' : 'none';
        t.classList.remove('rest');
        if (i < 6) t.textContent = '영역 ' + (i + 1);
      });
    } else {
      stage.className = 'split9';
      tiles.forEach(function(t, i) {
        t.style.display = i < 9 ? 'flex' : 'none';
        if (i === 8) {
          t.classList.add('rest');
          if (!t.querySelector('video')) {
            var wrap = document.createElement('div');
            wrap.className = 'cam-wrap';
            var v = document.createElement('video');
            v.id = 'video';
            v.setAttribute('autoplay', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('muted', '');
            if (video && video.srcObject) v.srcObject = video.srcObject;
            wrap.appendChild(v);
            t.innerHTML = '';
            t.appendChild(wrap);
          }
        } else {
          t.classList.remove('rest');
          t.textContent = i + 1;
        }
      });
    }
  }

  splitSelect.addEventListener('change', () => {
    splitMode = parseInt(splitSelect.value, 10);
    buildTiles();
    statusEl.textContent = splitMode === 6 ? '6분할 (3×2)' : '9분할 (3×3)';
  });

  let faceMesh = null;
  let calibIdx = 0;
  let calibData = [];
  let lastCalibCollect = 0;

  function getCalibPx() {
    const pts = CalibrationRegion.getCalibPointsPx(CALIB_N, window.innerWidth, window.innerHeight);
    return pts[calibIdx];
  }

  function startCalibration() {
    calibIdx = 0;
    calibData = [];
    calib.classList.add('show');
    calibText.textContent = '포인트 1 / ' + CALIB_N + ' — 점을 바라보세요 (약 2초)';
    const pt = getCalibPx();
    calibDot.style.left = pt.x + 'px';
    calibDot.style.top = pt.y + 'px';
    calibDot.style.transform = 'translate(-50%, -50%)';
    lastCalibCollect = Date.now();
  }

  function collectCalibSample(xNorm, yNorm) {
    const pt = getCalibPx();
    calibData.push({ screenX: pt.x, screenY: pt.y, xNorm, yNorm });
    calibIdx++;
    if (calibIdx >= CALIB_N) {
      coef = CalibrationRegion.fitPolynomialCalibration(calibData);
      calib.classList.remove('show');
      statusEl.textContent = '캘리브레이션 완료. 시선으로 타일을 선택하세요.';
      showToast('캘리브레이션 완료');
      return;
    }
    calibText.textContent = '포인트 ' + (calibIdx + 1) + ' / ' + CALIB_N + ' — 다음 점을 바라보세요';
    const next = CalibrationRegion.getCalibPointsPx(CALIB_N, window.innerWidth, window.innerHeight)[calibIdx];
    calibDot.style.left = next.x + 'px';
    calibDot.style.top = next.y + 'px';
    lastCalibCollect = Date.now();
  }

  btnCalib.addEventListener('click', () => {
    if (!cam) { showToast('먼저 시작 버튼으로 카메라를 켜세요'); return; }
    startCalibration();
  });

  function getTileCenters() {
    const n = splitMode === 6 ? 6 : 9;
    return tiles.slice(0, n).map(function(t) {
      const r = t.getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height / 2];
    });
  }

  faceMesh = new FaceMesh({ locateFile: function(f) { return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f; } });
  faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
  faceMesh.onResults(function(results) {
    if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
    var lm = results.multiFaceLandmarks[0].map(function(p) { return { x: 1 - p.x, y: p.y }; });

    if (calib.classList.contains('show')) {
      var now = Date.now();
      var g = getGazeNorm(lm);
      if (now - lastCalibCollect >= CALIB_COLLECT_MS) {
        collectCalibSample(g.xNorm, g.yNorm);
      }
      return;
    }

    if (!coef) return;
    var g = getGazeNorm(lm);
    var screen = CalibrationRegion.predictScreenPolynomial(g.xNorm, g.yNorm, coef.cx, coef.cy, window.innerWidth, window.innerHeight);
    var centers = getTileCenters();
    var idx = 0, bestD2 = Infinity;
    for (var i = 0; i < centers.length; i++) {
      var d2 = (screen.x - centers[i][0]) * (screen.x - centers[i][0]) + (screen.y - centers[i][1]) * (screen.y - centers[i][1]);
      if (d2 < bestD2) { bestD2 = d2; idx = i; }
    }
    var result = CalibrationRegion.applyInertia(idx, inertiaState, performance.now(), { holdMs: INERTIA_HOLD_MS });
    inertiaState = result.state;
    var stableIdx = result.idx;

    tiles.forEach(function(t, i) { t.classList.toggle('hot', i === stableIdx); });
    if (splitMode === 9 && stableIdx === 8) { hotIdx = -1; return; }

    var now = performance.now();
    if (stableIdx !== hotIdx) {
      hotIdx = stableIdx;
      hotSince = now;
      dwellArmed = false;
    } else {
      if (!dwellArmed) {
        if (now - hotSince >= 300) { dwellArmed = true; dwellStart = now; }
      } else {
        if (now - dwellStart >= DWELL_MS) {
          showToast('선택: 영역 ' + (stableIdx + 1));
          dwellArmed = false;
          hotIdx = -1;
        }
      }
    }
  });

  startBtn.addEventListener('click', async function() {
    startOverlay.style.display = 'none';
    statusEl.textContent = '카메라 시작 중…';
    try {
      faceMesh = faceMesh || new FaceMesh({ locateFile: function(f) { return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f; } });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
      cam = new Camera(video, {
        onFrame: async function() { await faceMesh.send({ image: video }); },
        width: 640,
        height: 480,
      });
      await cam.start();
      statusEl.textContent = '캘리브레이션 버튼을 누르고 9개 점을 바라보세요';
      buildTiles();
    } catch (e) {
      statusEl.textContent = '카메라 오류: ' + e.message;
    }
  });

  buildTiles();
})();
  </script>
</body>
</html>
